['t','More lines on a grating (same period) give maxima that are:','sharper (narrower)',['broader','shifted away','weaker in position only'],'The positions stay the same, but they become narrower and brighter.'],
['t','White light on a grating: in each order the closest colour to the centre is:','violet',['red','green','white'],'sin θ = mλ/d is smallest for the shortest wavelength.'],
['t','Which colour is deflected the most by a grating?','red',['violet','green','all equally'],'Red has the longest wavelength, so it has the largest angle.'],
['t','Fraunhofer diffraction means that:','the source and the screen are effectively at infinity (parallel rays)',['the light is white','the slit is very wide','the light is polarized'],'It is the simpler, far-field case of diffraction.'],
['t','A Michelson interferometer is used to:','measure tiny distances and wavelengths',['polarize light','focus rays','measure charge'],'Moving a mirror by λ/2 shifts the pattern by one fringe.'],
['t','A larger aperture of a telescope gives:','better angular resolution',['worse resolution','the same resolution','only colour changes'],'θmin = 1.22λ/D falls with D.'],
['t','The Poisson spot is:','a bright point in the centre of the shadow of a round disk',['a dark point in a bright ring','a rainbow','a polarized spot'],'It confirmed the wave nature of light.']
/*Q5_END*/]},
{id:6,t:"Polarization",qs:[
['f','Malus’s law for polarized light through an analyzer at angle θ:','I = I₀cos²θ',['I = I₀cos θ','I = I₀sin²θ','I = I₀/cos²θ'],'Only the component of E along the axis passes, and I goes as E².'],
['f','Unpolarized light of intensity I₀ goes through an ideal polarizer. The intensity is:','I₀/2',['I₀','I₀/4','0'],'On average, half of the random orientations pass.'],
['f','Polarized light I₀ meets a polarizer at 60°. The intensity is:','I₀/4',['I₀/2','0.87 I₀','I₀/8'],'cos²60° = (0.5)² = 0.25.'],
['f','Unpolarized I₀ passes two polarizers with axes 45° apart. The final intensity is:','I₀/4',['I₀/2','I₀/8','I₀/√2'],'I₀/2 after the first, then times cos²45° = ½ gives I₀/4.'],
['f','Two crossed polarizers (90° apart) transmit:','no light',['half of the light','one quarter','all light'],'cos²90° = 0.'],
['f','Unpolarized I₀ passes polarizers at 0°, 45° and 90°. The final intensity is:','I₀/8',['0','I₀/4','I₀/2'],'I₀/2 · cos²45° · cos²45° = I₀/2 · ½ · ½ = I₀/8.'],
['f','Brewster’s angle (light from medium 1 to medium 2):','tan θB = n₂/n₁',['sin θB = n₂/n₁','cos θB = n₂/n₁','tan θB = n₁/n₂'],'At this angle, the reflected light is fully polarized.'],
['f','Brewster’s angle for air to glass (n = 1.5) is about:','56.3°',['41.8°','33.7°','45°'],'θB = arctan 1.5 ≈ 56.3°.'],
['f','At Brewster’s angle, the reflected and refracted rays make an angle of:','90°',['45°','180°','0°'],'That is why tan θB = n₂/n₁ holds.'],
['f','Degree of polarization:','P = (Imax − Imin)/(Imax + Imin)',['P = (Imax + Imin)/(Imax − Imin)','P = Imax/Imin','P = Imin/Imax'],'It is 0 for natural light and 1 for fully polarized light.'],
['f','Imax = 3 and Imin = 1. The degree of polarization is:','0.5',['2','0.25','0.75'],'P = (3 − 1)/(3 + 1) = 0.5.'],
['f','Rotation of the polarization plane in a solution (specific rotation [α], concentration c, length l):','φ = [α]·c·l',['φ = [α]/(c·l)','φ = c/([α]·l)','φ = [α]·c·l²'],'The rotation grows with concentration and path length.'],
['f','A quarter-wave plate introduces a phase difference of:','π/2',['π','2π','π/4'],'It corresponds to a path difference of λ/4.'],
['f','Thickness of a quarter-wave plate (indices nₒ and nₑ):','d = λ/(4|nₒ − nₑ|)',['d = λ/(2|nₒ − nₑ|)','d = λ|nₒ − nₑ|/4','d = 4λ/|nₒ − nₑ|'],'The path difference |nₒ − nₑ|d must equal λ/4.'],
['f','Polarized light meets a polarizer at 30°. The transmitted fraction is:','0.75',['0.5','0.87','0.25'],'cos²30° = (0.866)² = 0.75.'],
['f','Natural light passes a polarizer that is rotated. The intensity:','stays I₀/2 at every angle',['changes as cos²θ','changes as sin θ','falls to zero'],'Natural light has no preferred direction.'],
['f','Faraday rotation in a magnetic field B (Verdet constant V, length l):','φ = V·B·l',['φ = V/(B·l)','φ = V·B/l','φ = V·B·l²'],'The rotation is proportional to B and to the length.'],
['f','Two parallel polarizers (0° apart) and natural light I₀. The final intensity is:','I₀/2',['I₀','I₀/4','0'],'The second polarizer passes everything the first one passed.'],
['f','Polarized light meets a polarizer at 0°. The intensity is:','I₀',['I₀/2','0','I₀/4'],'cos²0° = 1.'],
['f','Polarized light meets a polarizer at 45°. The intensity is:','I₀/2',['I₀','I₀/4','0'],'cos²45° = ½.'],
['t','Polarization proves that light waves are:','transverse',['longitudinal','sound waves','scalar'],'Only transverse waves can be polarized.'],
['t','In natural light, the vector E:','oscillates in all directions perpendicular to the ray',['oscillates along the ray','is always vertical','does not oscillate'],'The directions change randomly and quickly.'],
['t','In plane-polarized light, E oscillates:','in one fixed plane',['in all planes','along the ray','in a circle'],'The direction of E does not change.'],
['t','A polarizer transmits:','the component of E along its axis',['the component of E perpendicular to the axis','all components','only B'],'The perpendicular component is absorbed or reflected.'],
['t','Can sound in air be polarized?','No, it is a longitudinal wave',['Yes, always','Yes, at high frequencies','Only in water'],'The oscillation is along the direction of travel, so there is nothing to select.'],
['t','Light reflected from glass or water is:','partially polarized, and fully at Brewster’s angle',['never polarized','always unpolarized','polarized along the ray'],'Reflected light is polarized perpendicular to the plane of incidence.'],
['t','Polarizing sunglasses reduce glare because they block:','horizontally polarized light reflected from surfaces',['all light equally','red light','infrared'],'Reflected glare from roads and water is mostly horizontal.'],
['t','Birefringence is:','splitting of light into two rays in an anisotropic crystal',['bending of light around edges','reflection from two surfaces','absorption of light'],'The crystal has two refractive indices.'],
['t','The ordinary ray in a birefringent crystal:','obeys Snell’s law',['never refracts','has speed c in the crystal','is always unpolarized'],'The extraordinary ray does not follow it in general.'],
['t','The optic axis of a crystal is the direction along which:','there is no double refraction',['light is absorbed','light is fastest only','light is reflected'],'Both rays travel with the same speed there.'],
['t','A Nicol prism is used to:','produce polarized light by removing one of the two rays',['focus light','disperse light','absorb all light'],'One ray is reflected away at a cement layer.'],
['t','Dichroism is:','selective absorption of one polarization',['splitting of colours','reflection of both','diffraction'],'Polaroid film is based on it.'],
['t','Optically active substances (for example a sugar solution):','rotate the plane of polarization',['absorb all light','make light unpolarized','change the frequency'],'The rotation angle depends on concentration and length.'],
['t','In circularly polarized light, the vector E:','rotates with constant magnitude',['stays fixed','oscillates along the ray','is zero'],'The tip of E draws a circle.'],
['t','Elliptical polarization appears when:','two perpendicular components have different amplitudes or a phase shift not equal to 0, π',['E is zero','light is unpolarized','the frequency is zero'],'Circular and linear are special cases.'],
['t','A quarter-wave plate with its axis at 45° to linear polarized light gives:','circularly polarized light',['natural light','no light','light of double frequency'],'Both components have equal amplitude and a π/2 shift.'],
['t','A half-wave plate for linear polarized light:','rotates the plane of polarization',['makes it circular','absorbs it','makes it natural'],'The plane is turned by twice the angle to the axis.'],
['t','Photoelasticity is:','stress that makes a transparent material birefringent',['reflection of light','absorption of light','thermal radiation'],'Stress patterns can be seen between crossed polarizers.'],
['t','Liquid crystal displays use:','polarizers and liquid crystals that rotate the polarization',['only lasers','only mirrors','X-rays'],'Voltage controls the rotation, and so the brightness.'],
['t','What happens to the intensity if a third polarizer is placed between two crossed polarizers at 45°?','Light appears again',['Still no light','Intensity doubles to I₀','Light becomes circular'],'Each step turns the plane by 45°, so some light passes both steps (I₀/8 for natural light).']
/*Q6_END*/]},
{id:7,t:"Blackbody radiation. Photoelectric effect. Compton",qs:[
['f','Stefan–Boltzmann law for the emittance of a blackbody:','R = σT⁴',['R = σT','R = σT²','R = σ/T⁴'],'Radiated power per area grows as the fourth power of temperature.'],
['f','The temperature of a blackbody is doubled. The radiated power changes by a factor of:','16',['2','4','8'],'2⁴ = 16.'],
['f','Wien’s displacement law:','λmax·T = b',['λmax/T = b','λmax = b·T','λmax·T² = b'],'Hotter bodies peak at shorter wavelengths. b ≈ 2.9·10⁻³ m·K.'],
['f','The Sun has T ≈ 5800 K. The peak wavelength is about:','500 nm',['50 nm','5 μm','1000 nm'],'λmax = 2.9·10⁻³/5800 ≈ 5·10⁻⁷ m, in the green.'],
['f','Energy of a photon of frequency f:','E = hf',['E = h/f','E = hf²','E = f/h'],'Planck’s relation: energy comes in portions hf.'],
['f','Photon energy in terms of the wavelength:','E = hc/λ',['E = hλ/c','E = λ/(hc)','E = h/(cλ)'],'Use f = c/λ in E = hf.'],
['f','The energy of a photon with λ = 500 nm is about:','2.5 eV',['1.2 eV','5.0 eV','0.25 eV'],'E = 1240 eV·nm/500 nm = 2.48 eV.'],
['f','Einstein’s equation for the photoelectric effect:','hf = A + Kmax',['hf = A − Kmax','hf = A·Kmax','hf = Kmax/A'],'A photon’s energy pays for leaving the metal (A) and gives kinetic energy.'],
['f','The red limit (threshold) frequency:','f₀ = A/h',['f₀ = A·h','f₀ = h/A','f₀ = A/h²'],'Set Kmax = 0 in Einstein’s equation.'],
['f','Stopping voltage and the maximum kinetic energy:','eU = Kmax',['eU = hf','eU = A','U = Kmax·e'],'The retarding field stops even the fastest electron.'],
['f','hf = 3.0 eV and A = 2.0 eV. The maximum kinetic energy is:','1.0 eV',['5.0 eV','2.0 eV','0.5 eV'],'Kmax = hf − A = 1.0 eV.'],
['f','For the same case (hf = 3.0 eV, A = 2.0 eV) the stopping voltage is:','1.0 V',['2.0 V','3.0 V','0.5 V'],'eU = 1.0 eV, so U = 1.0 V.'],
['f','Momentum of a photon:','p = h/λ',['p = hλ','p = λ/h','p = h/λ²'],'It also equals E/c.'],
['f','Compton shift of the wavelength (scattering angle θ):','Δλ = (h/m_e c)(1 − cos θ)',['Δλ = (h/m_e c)(1 + cos θ)','Δλ = (h/m_e c) sin θ','Δλ = (h/m_e c) cos θ'],'The shift is zero at θ = 0 and maximal at θ = 180°.'],
['f','The Compton shift at θ = 90° is about:','2.43 pm',['4.86 pm','0','1.2 pm'],'(1 − cos 90°) = 1, so Δλ = h/(m_e c) = 2.43 pm.'],
['f','The maximum Compton shift (θ = 180°) is about:','4.86 pm',['2.43 pm','0','9.7 pm'],'(1 − cos 180°) = 2, so Δλ = 2h/(m_e c).'],
['f','The light intensity is doubled (frequency fixed above threshold). Kmax:','does not change',['doubles','halves','quadruples'],'Kmax depends on the photon energy, not on how many photons arrive.'],
['f','A 1 W source emits light of λ = 500 nm. The number of photons per second is about:','2.5×10¹⁸',['5×10¹⁹','2.5×10¹⁵','4×10⁻¹⁹'],'N = P/E = 1/(4·10⁻¹⁹ J) ≈ 2.5·10¹⁸.'],
['f','The value of Planck’s constant is about:','6.63×10⁻³⁴ J·s',['6.63×10⁻³¹ J·s','1.6×10⁻¹⁹ J·s','6.67×10⁻¹¹ J·s'],'It is extremely small, which is why quantum effects are hidden in daily life.'],
['t','What is a blackbody?','A body that absorbs all radiation falling on it',['A body that reflects everything','A body at 0 K','A body that is always dark'],'A good absorber is also a good emitter.'],
['t','What was the “ultraviolet catastrophe”?','Classical theory predicted infinite radiation at short wavelengths',['A star exploding','A UV laser failure','Too much UV from the Sun'],'It disagreed with the experiment and led to Planck’s idea.'],
['t','What was Planck’s hypothesis?','Atoms emit and absorb energy in quanta E = hf',['Light is only a wave','Energy is continuous','Temperature is quantized'],'This removed the catastrophe and started quantum theory.'],
['t','When the temperature of a blackbody rises, the peak of its spectrum:','moves to shorter wavelengths',['moves to longer wavelengths','does not move','disappears'],'This follows from Wien’s law.'],
['t','The total power radiated by a blackbody grows with the temperature as:','T⁴',['T','T²','1/T'],'Stefan–Boltzmann law.'],
['t','What is the photoelectric effect?','Emission of electrons from a metal under light',['Heating of a metal by light','Reflection of light','Emission of light by a metal'],'Hertz and Einstein studied it.'],
['t','Which prediction of classical wave theory failed in the photoeffect?','That any frequency works if the light is intense enough',['That electrons exist','That metals conduct','That light is electromagnetic'],'In experiments there is a threshold frequency.'],
['t','Light below the threshold frequency falls on a metal. The electrons:','are not emitted at any intensity',['are emitted if it is bright enough','are emitted after a long time','are emitted with zero energy'],'A single photon is too weak, and photons do not combine.'],
['t','At a fixed frequency above threshold, more intensity gives:','more electrons, the same Kmax',['faster electrons','no change at all','slower electrons'],'More photons means more electrons, but each has the same energy.'],
['t','Kmax of photoelectrons depends on:','the frequency of light and the metal',['the intensity only','the exposure time','the area of the metal'],'Kmax = hf − A.'],
['t','The emission of photoelectrons begins:','almost instantly',['after minutes of heating','only after a long delay','after the light is switched off'],'One photon gives its energy to one electron at once.'],
['t','What is the work function?','The minimum energy needed to remove an electron from the metal',['The energy of the light','The charge of the electron','The speed of the electron'],'It is different for different metals.'],
['t','The saturation photocurrent is proportional to:','the light intensity',['the frequency','the stopping voltage','the work function'],'It counts the number of electrons per second.'],
['t','A photon has:','energy hf and momentum h/λ, but no rest mass',['mass and charge','charge only','no energy'],'It always moves at the speed c.'],
['t','What is the Compton effect?','Scattering of X-rays by electrons with an increase in wavelength',['Reflection of light','Emission of electrons by light','Splitting of a spectral line'],'The photon gives part of its energy to the electron.'],
['t','The Compton shift depends on:','the scattering angle only',['the initial wavelength','the material only','the intensity'],'Δλ = (h/m_e c)(1 − cos θ).'],
['t','The Compton effect shows that light behaves as:','particles with momentum',['only waves','sound','heat only'],'The collision obeys energy and momentum conservation.'],
['t','Why is the Compton shift not seen with visible light?','It is tiny compared to a visible wavelength',['Visible light has no energy','Electrons are absent','It is forbidden'],'A shift of a few pm is negligible next to 500 nm.'],
['t','What is wave–particle duality of light?','Light shows both wave and particle properties',['Light is only a wave','Light is only a particle','Light is sound'],'Interference shows waves, the photoeffect shows photons.'],
['t','Why does the electron recoil in Compton scattering?','Momentum is conserved in the photon–electron collision',['It is attracted by the nucleus','It is heated','It absorbs the photon completely'],'The photon changes its direction, so the electron gets momentum.'],
['t','What does the photoelectric effect show about the energy of light?','It is carried in discrete portions (photons)',['It is spread continuously over the wave','It is always zero','It depends only on the intensity'],'One photon gives all its energy to one electron.']
/*Q7_END*/]},
{id:8,t:"Bohr postulates",qs:[
['f','Bohr’s quantization of the electron’s angular momentum:','mvr = nħ',['mvr = nh','mvr = n²ħ','mv = nħr'],'The orbit has to carry whole multiples of ħ = h/2π.'],
['f','Energy levels of hydrogen:','Eₙ = −13.6 eV/n²',['Eₙ = +13.6 eV/n','Eₙ = −13.6 eV/n','Eₙ = −13.6 n² eV'],'Negative means that the electron is bound.'],
['f','The energy of the n = 2 level of hydrogen is:','−3.4 eV',['−6.8 eV','−1.5 eV','−13.6 eV'],'−13.6/4 = −3.4 eV.'],
['f','The energy of the n = 3 level of hydrogen is:','−1.51 eV',['−4.5 eV','−3.4 eV','−0.85 eV'],'−13.6/9 = −1.51 eV.'],
['f','Radius of the nth Bohr orbit:','rₙ = n²a₀',['rₙ = n·a₀','rₙ = a₀/n²','rₙ = n³a₀'],'The radius grows as n².'],
['f','The Bohr radius a₀ is about:','0.053 nm',['0.53 nm','5.3 nm','0.0053 nm'],'It is the radius of the ground-state orbit.'],
['f','The radius of the n = 3 orbit is about:','0.48 nm',['0.16 nm','0.053 nm','1.4 nm'],'r₃ = 9·0.053 nm ≈ 0.48 nm.'],
['f','Energy of the emitted photon in a transition from Eᵢ to E_f (Eᵢ > E_f):','hf = Eᵢ − E_f',['hf = Eᵢ + E_f','hf = Eᵢ·E_f','hf = Eᵢ/E_f'],'Energy conservation.'],
['f','The photon energy for the transition n = 2 → n = 1 in hydrogen:','10.2 eV',['13.6 eV','3.4 eV','1.9 eV'],'−3.4 − (−13.6) = 10.2 eV.'],
['f','The wavelength for the transition 2 → 1 is about:','122 nm',['365 nm','656 nm','91 nm'],'λ = 1240/10.2 ≈ 122 nm (ultraviolet).'],
['f','The wavelength for the transition 3 → 2 (H-alpha) is about:','656 nm',['486 nm','122 nm','365 nm'],'ΔE = 1.89 eV, and λ = 1240/1.89 ≈ 656 nm, red light.'],
['f','The Rydberg formula for hydrogen:','1/λ = R(1/n₁² − 1/n₂²)',['1/λ = R(1/n₁ − 1/n₂)','1/λ = R(n₁² − n₂²)','1/λ = R(1/n₁² + 1/n₂²)'],'The differences of the 1/n² terms give the lines.'],
['f','The ionization energy of hydrogen in the ground state:','13.6 eV',['3.4 eV','10.2 eV','27.2 eV'],'It is the energy to move from n = 1 to E = 0.'],
['f','The speed of the electron in the nth orbit compared to the first:','vₙ = v₁/n',['vₙ = v₁n','vₙ = v₁/n²','vₙ = v₁n²'],'Higher orbits are slower.'],
['f','Energy levels of a hydrogen-like ion with nuclear charge Z:','Eₙ = −13.6 Z²/n² eV',['Eₙ = −13.6 Z/n² eV','Eₙ = −13.6/(Z²n²) eV','Eₙ = −13.6 Zn² eV'],'The nucleus pulls Z times harder, and the energy goes as Z².'],
['f','The ground-state energy of He⁺ (Z = 2) is:','−54.4 eV',['−27.2 eV','−13.6 eV','−108.8 eV'],'−13.6·4 = −54.4 eV.'],
['f','The Balmer series consists of transitions to the level n =','2',['1','3','4'],'These lines are in the visible range.'],
['f','The number of different spectral lines possible for transitions from n = 4 down is:','6',['3','4','10'],'4→3, 4→2, 4→1, 3→2, 3→1, 2→1.'],
['f','The orbital angular momentum of the electron in the n = 2 orbit:','2ħ',['ħ','4ħ','2ħ²'],'L = nħ.'],
['f','The kinetic energy of the electron in the n = 2 orbit:','3.4 eV',['6.8 eV','13.6 eV','1.7 eV'],'K = −Eₙ = 13.6/4 eV.'],
['t','What does Bohr’s first postulate say?','The electron moves in stationary orbits without radiating',['The electron radiates all the time','The nucleus rotates','Orbits are random'],'Only some orbits are allowed.'],
['t','What does Bohr’s second postulate say?','Light is emitted or absorbed only in transitions, with hf = Eᵢ − E_f',['Light is emitted continuously','Light is always absorbed','Atoms never emit light'],'Photons correspond to jumps between levels.'],
['t','Why did Rutherford’s planetary model fail?','An accelerating electron should radiate and fall into the nucleus',['Electrons have no charge','The nucleus is too big','Atoms are neutral'],'This would make atoms unstable.'],
['t','In the Bohr model, what is quantized?','The angular momentum of the electron',['The speed of light','The mass of the nucleus','The temperature'],'This gives discrete radii and energies.'],
['t','The ground state is:','the lowest energy level (n = 1)',['the highest level','the level at E = 0','a free electron'],'The atom is stable there.'],
['t','An excited state is:','a state with a higher energy than the ground state',['the lowest state','a state with no electron','a free state'],'It is unstable, and the atom returns down.'],
['t','Why are the energies of bound states negative?','The zero is a free electron at rest, and the bound electron has lower energy',['The electron has negative mass','The nucleus is negative','It is only a convention without meaning'],'It takes energy to free the electron.'],
['t','E = 0 corresponds to:','ionization (a free electron at rest)',['the ground state','the first excited state','a photon'],'It is the top of the level ladder.'],
['t','An absorption spectrum of hydrogen has dark lines because:','atoms absorb only photons that match the level differences',['all light is absorbed','atoms are cold','there is no light'],'These wavelengths are removed from the light.'],
['t','Atomic emission spectra are discrete because:','energy levels are discrete',['light is slow','atoms are small only','atoms are random'],'Only certain photon energies are possible.'],
['t','The Lyman series (transitions to n = 1) lies in:','the ultraviolet',['the visible range','the infrared','radio waves'],'Energies of 10 eV and more mean short wavelengths.'],
['t','The Balmer series lies in:','the visible range',['the ultraviolet','the infrared','X-rays'],'Transitions to n = 2, with λ from 365 to 656 nm.'],
['t','The Paschen series (to n = 3) lies in:','the infrared',['the ultraviolet','the visible range','gamma rays'],'The energy differences are small, so λ is long.'],
['t','As n grows, the neighbouring energy levels:','get closer together',['move apart','stay equal','disappear'],'Eₙ ~ 1/n² converges to zero.'],
['t','What did the Franck–Hertz experiment show?','Atoms take energy only in discrete portions',['Light is a wave','Electrons have spin','Nuclei decay'],'It confirmed the discrete energy levels.'],
['t','The Bohr model works well for:','hydrogen and hydrogen-like ions',['all atoms','heavy atoms only','molecules'],'It fails for many-electron atoms.'],
['t','The Bohr model cannot explain:','the intensities and fine structure of spectral lines',['the hydrogen line positions','the energy 13.6 eV','the series of lines'],'This needs full quantum mechanics.'],
['t','What does the correspondence principle say?','Quantum results become classical at large n',['Classical physics is wrong','Quantum physics is for large objects only','n is always 1'],'The orbits then behave like classical ones.'],
['t','Going to a lower level, the atom:','emits a photon',['absorbs a photon','does nothing','emits an electron'],'The energy lost goes into the photon.'],
['t','Which Balmer line has the longest wavelength?','3 → 2 (H-alpha)',['4 → 2','5 → 2','∞ → 2'],'It has the smallest energy difference.']
/*Q8_END*/]},
{id:9,t:"De Broglie. Uncertainty. Schrödinger",qs:[
['f','de Broglie wavelength of a particle with momentum p:','λ = h/p',['λ = hp','λ = p/h','λ = h/p²'],'Matter has a wavelength inversely proportional to momentum.'],
['f','An electron moves at 10⁶ m/s. Its de Broglie wavelength is about:','0.73 nm',['7.3 nm','0.073 nm','73 nm'],'λ = h/(mv) = 6.63·10⁻³⁴/(9.11·10⁻³¹·10⁶) ≈ 7.3·10⁻¹⁰ m.'],
['f','A ball of 0.1 kg moves at 10 m/s. Its de Broglie wavelength is about:','7×10⁻³⁴ m',['7×10⁻³ m','7×10⁻¹⁰ m','7 m'],'λ = h/(mv) = 6.63·10⁻³⁴/1. It is far too small to detect.'],
['f','Wavelength of an electron accelerated through a voltage U:','λ = h/√(2meU)',['λ = h/(2meU)','λ = h·√(2meU)','λ = h/√(meU)'],'eU = p²/2m gives p = √(2meU).'],
['f','An electron is accelerated through 150 V. Its wavelength is about:','0.1 nm',['1 nm','0.01 nm','10 nm'],'λ ≈ 1.226/√150 nm ≈ 0.1 nm, like the atomic spacing.'],
['f','Relation between the momentum and the wave number k:','p = ħk',['p = ħ/k','p = hk','p = ħk²'],'It is the same as λ = h/p with k = 2π/λ.'],
['f','Heisenberg’s uncertainty relation for position and momentum:','Δx·Δp ≥ ħ/2',['Δx·Δp ≥ 2ħ','Δx·Δp ≤ ħ/2','Δx·Δp = 0'],'Making one smaller makes the other larger.'],
['f','Energy–time uncertainty relation:','ΔE·Δt ≥ ħ/2',['ΔE/Δt ≥ ħ/2','ΔE·Δt ≤ ħ/2','ΔE + Δt ≥ ħ/2'],'A short-lived state has a broad energy.'],
['f','An electron is confined to Δx = 10⁻¹⁰ m. The minimum momentum uncertainty is about:','5×10⁻²⁵ kg·m/s',['5×10⁻³⁵ kg·m/s','5×10⁻¹⁵ kg·m/s','5×10⁻²⁰ kg·m/s'],'Δp ≥ ħ/(2Δx) = 1.05·10⁻³⁴/(2·10⁻¹⁰).'],
['f','Time-independent Schrödinger equation in 1D:','−(ħ²/2m)ψ″ + Uψ = Eψ',['−(ħ²/2m)ψ″ − Uψ = Eψ','(ħ²/2m)ψ″ + Uψ = E','ψ″ + Uψ = E'],'Kinetic energy plus potential energy acting on ψ equals E·ψ.'],
['f','Probability density of finding a particle:','|ψ|²',['ψ','|ψ|','dψ/dx'],'ψ itself is not measurable, but its square modulus is.'],
['f','The normalization condition:','∫|ψ|² dx = 1',['∫ψ dx = 1','∫|ψ|² dx = 0','∫ψ² dx = ∞'],'The particle must be found somewhere with certainty.'],
['f','Energy levels of a particle in an infinite well of width L:','Eₙ = n²π²ħ²/(2mL²)',['Eₙ = nπ²ħ²/(2mL²)','Eₙ = n²π²ħ²/(2mL)','Eₙ = n²πħ/(2mL²)'],'The energies grow as n² and fall with L².'],
['f','Wave function of a particle in an infinite well:','ψₙ = √(2/L) sin(nπx/L)',['ψₙ = √(2/L) cos(nπx/L)','ψₙ = √(2/L) sin(nπx/2L)','ψₙ = √(L/2) sin(nπx/L)'],'It must vanish at x = 0 and x = L, so it is a sine.'],
['f','The well width L is doubled. The energy of each level becomes:','one quarter',['half','double','four times'],'E ∝ 1/L².'],
['f','The ratio E₂/E₁ in an infinite well:','4',['2','8','1/4'],'Eₙ ∝ n², so 2² = 4.'],
['f','How many nodes (inside the well) does the state n have?','n − 1',['n','n + 1','2n'],'The ground state has none, and each higher state adds one.'],
['f','The ground-state energy of an electron in a well of width 1 nm is about:','0.38 eV',['3.8 eV','0.038 eV','1.5 eV'],'E₁ = π²ħ²/(2mL²) ≈ 0.376 eV.'],
['f','Zero-point energy of a quantum harmonic oscillator:','E₀ = ħω/2',['0','ħω','3ħω/2'],'It cannot be zero because of the uncertainty relation.'],
['f','Energy levels of a quantum harmonic oscillator:','Eₙ = ħω(n + ½)',['Eₙ = ħωn','Eₙ = ħω(n + 1)','Eₙ = ħωn²'],'The levels are equally spaced by ħω.'],
['t','What are matter waves?','Waves associated with every moving particle',['Only light waves','Sound waves in matter','Waves in the nucleus only'],'This is de Broglie’s hypothesis.'],
['t','What did the Davisson–Germer experiment show?','Electrons diffract on a crystal, like waves',['Electrons have no mass','Light has momentum','Atoms are neutral'],'It confirmed de Broglie’s idea.'],
['t','Why do we not see wave behaviour of a moving car?','Its de Broglie wavelength is extremely small',['Cars have no energy','Cars are not made of atoms','Waves exist only in vacuum'],'The wavelength is far below anything measurable.'],
['t','What does the wave function ψ describe?','The state of a quantum particle; |ψ|² gives the probability density',['The exact path of the particle','The energy only','The charge only'],'It is a probability amplitude.'],
['t','Can ψ itself be measured directly?','No, only |ψ|² (probabilities) is observable',['Yes, always','Yes, with a microscope','Only for electrons'],'ψ can be complex.'],
['t','What does the uncertainty principle say?','Position and momentum cannot both be known exactly at once',['Measuring devices are bad','Particles do not exist','Energy is not conserved'],'It is a basic limit in nature.'],
['t','Is the uncertainty principle caused by imperfect instruments?','No, it is a fundamental property of nature',['Yes, better devices remove it','Yes, only at high temperatures','Only for light'],'It comes from the wave nature of matter.'],
['t','Why does the electron not fall onto the nucleus?','Confinement to a small region raises its kinetic energy (uncertainty principle)',['It has no charge','The nucleus repels it','It moves too fast to be attracted'],'Balance between Coulomb attraction and kinetic energy gives a stable size.'],
['t','What is the Schrödinger equation?','The basic equation of quantum mechanics that determines ψ',['An equation for light only','An equation for heat','An equation of gravity'],'Solving it gives allowed energies and states.'],
['t','What boundary condition is used for an infinite well?','ψ = 0 at the walls',['ψ is maximal at the walls','ψ = 1 everywhere','ψ is infinite at the walls'],'The particle cannot be outside the well.'],
['t','Why is the energy in a well quantized?','Only waves that fit the boundary conditions are allowed',['The particle is heavy','The walls are hot','Energy is conserved'],'It is like standing waves on a string.'],
['t','The lowest energy of a particle in a well is:','not zero',['zero','negative','infinite'],'A zero energy would mean Δp = 0 and Δx = L, which breaks the uncertainty principle.'],
['t','What is quantum tunnelling?','A particle passes through a barrier higher than its energy',['A particle goes around a barrier','A particle is stopped','A particle is destroyed'],'The wave function decays inside the barrier but is not zero.'],
['t','Tunnelling probability decreases when:','the barrier gets wider or higher',['the barrier gets thinner','the mass gets smaller','the barrier disappears'],'The decay inside the barrier is exponential.'],
['t','Which device is based on tunnelling?','Scanning tunnelling microscope',['Lens','Polarizer','Mirror'],'The tunnelling current is very sensitive to distance.'],
['t','What does the superposition principle say in quantum mechanics?','A sum of solutions is also a solution',['Solutions never add','Only one solution exists','The sum is always zero'],'The Schrödinger equation is linear.'],
['t','What is a stationary state?','A state where the probability density does not change with time',['A state at rest with zero energy','A state with no particle','A state with infinite energy'],'It has a definite energy.'],
['t','A physical wave function must be:','continuous, finite and single-valued',['discontinuous','infinite at some points','many-valued'],'Otherwise the probability would not make sense.'],
['t','What is the principle of complementarity?','Wave and particle aspects do not show up at the same time in one experiment',['Light is only a wave','Particles never interfere','Waves have no energy'],'An experiment shows one of the two aspects.'],
['t','Electrons are sent one at a time through two slits. After many electrons:','an interference pattern appears',['two bright bands only','no pattern','one bright band only'],'Each electron arrives as a dot, but the dots add up to fringes.']
/*Q9_END*/]},
{id:10,t:"Pauli exclusion principle",qs:[
['f','Maximum number of electrons in the shell with the principal number n:','2n²',['n²','2n','2n + 1'],'There are n² orbitals and each holds 2 electrons.'],
['f','Maximum number of electrons in the subshell with the orbital number l:','2(2l + 1)',['2l + 1','2l','4l'],'There are 2l + 1 orbitals, with 2 electrons each.'],
['f','The maximum number of electrons in the shell n = 3 is:','18',['9','8','6'],'2·3² = 18.'],
['f','How many orbitals are in the d subshell (l = 2)?','5',['3','7','10'],'2l + 1 = 5.'],
['f','How many electrons can a p subshell hold?','6',['2','10','3'],'3 orbitals × 2 electrons.'],
['f','Allowed values of the orbital quantum number l for a given n:','0, 1, …, n − 1',['1, …, n','0, …, n','−n, …, n'],'For n = 1 only l = 0 is possible.'],
['f','Allowed values of the magnetic quantum number mₗ:','from −l to +l',['from 0 to l','from 1 to l','from −n to n'],'That gives 2l + 1 values.'],
['f','The spin quantum number of an electron can be:','+½ or −½',['0 or 1','+1 or −1','only +½'],'The electron has spin ½ with two projections.'],
['f','Magnitude of the orbital angular momentum:','L = √(l(l + 1))·ħ',['L = lħ','L = l²ħ','L = √l·ħ'],'It is not simply lħ.'],
['f','For l = 1, the magnitude of L is:','√2 ħ ≈ 1.41ħ',['ħ','2ħ','√3 ħ'],'√(1·2) = √2.'],
['f','Magnitude of the electron spin:','S = (√3/2)ħ',['ħ/2','ħ','3ħ/2'],'√(s(s + 1)) = √(3/4).'],
['f','The z-component of the orbital angular momentum:','L_z = mₗħ',['L_z = mₗħ²','L_z = lħ','L_z = mₗ/ħ'],'It takes only discrete values.'],
['f','The electron configuration of sodium (Z = 11):','1s²2s²2p⁶3s¹',['1s²2s²2p⁶3p¹','1s²2s²2p⁵3s²','1s²2s²2p⁷'],'The 11th electron goes into 3s, because 2p is full with 6.'],
['f','The electron configuration of oxygen (Z = 8):','1s²2s²2p⁴',['1s²2s²2p⁶','1s²2s⁴2p²','1s²2s²2p²'],'2 + 2 + 4 = 8 electrons.'],
['f','The electron configuration of argon (Z = 18):','1s²2s²2p⁶3s²3p⁶',['1s²2s²2p⁶3s²3p⁴','1s²2s²2p⁶3s²3p⁶3d²','1s²2s²2p⁶3s⁴3p⁴'],'2 + 2 + 6 + 2 + 6 = 18. The outer shell is full.'],
['f','How many electrons does a full 3d subshell contain?','10',['6','14','5'],'5 orbitals × 2 electrons.'],
['f','Which subshell is filled right after 3p?','4s',['3d','4p','4d'],'4s has a lower energy than 3d.'],
['f','The number of different quantum states of an electron with n = 2:','8',['4','2','18'],'2n² = 8 including spin.'],
['f','The number of (l, mₗ) combinations (orbitals) for n = 3:','9',['3','6','18'],'n² = 9.'],
['f','Three electrons occupy a p subshell. By Hund’s rule, the total spin is:','3/2',['1/2','1','0'],'Each orbital gets one electron, all with parallel spins: 3 × ½.'],
['t','What does the Pauli exclusion principle say?','No two electrons in an atom can have the same four quantum numbers',['All electrons have the same energy','Electrons never move','Electrons have no spin'],'Two electrons must differ in at least one of n, l, mₗ, mₛ.'],
['t','To which particles does the Pauli principle apply?','Fermions (particles with half-integer spin)',['Photons','Bosons','All particles equally'],'Electrons, protons and neutrons are fermions.'],
['t','Do bosons obey the Pauli principle?','No, many bosons can be in one state',['Yes, always','Only photons do','Only at low temperature'],'This is why a laser can contain so many photons in one mode.'],
['t','What does the Pauli principle explain?','The shell structure of atoms and the periodic table',['The speed of light','Gravity','Radioactivity'],'Electrons fill the levels one after another.'],
['t','What is the electron spin?','An intrinsic angular momentum with no classical analogue',['Rotation of a small ball','Orbital motion','The charge of the electron'],'It is a quantum property of the particle itself.'],
['t','How many electrons can be in one orbital?','At most two, with opposite spins',['One','Three','Any number'],'Their mₛ values are +½ and −½.'],
['t','The principal quantum number n determines:','the main energy level and the size of the orbit',['the orientation only','the spin only','the charge'],'Larger n means higher energy and a larger size.'],
['t','The orbital quantum number l determines:','the shape of the orbital and the magnitude of L',['the spin','the mass','the energy of the nucleus'],'l = 0 is spherical, and l = 1 is dumbbell-shaped.'],
['t','The magnetic quantum number mₗ determines:','the orientation (the projection of L on an axis)',['the size of the orbit','the energy only','the spin'],'In a field, it splits the levels.'],
['t','The spin quantum number mₛ determines:','the projection of the spin (up or down)',['the shape of the orbit','the radius','the principal number'],'It has two values: +½ and −½.'],
['t','What does Hund’s rule say?','Electrons fill degenerate orbitals singly with parallel spins first',['Electrons pair up first','All electrons have opposite spins','Electrons fill the highest level first'],'This minimizes the repulsion and the energy.'],
['t','What does the Aufbau principle say?','Electrons fill the lowest available energy levels first',['Electrons fill the highest level first','Electrons are random','Electrons stay in one level'],'The atom tries to reach the lowest total energy.'],
['t','The letters s, p, d, f correspond to l =','0, 1, 2, 3',['1, 2, 3, 4','0, 2, 4, 6','1, 3, 5, 7'],'It is a historical notation.'],
['t','Why are noble gases chemically inert?','Their outer shells are completely filled',['They have no electrons','They are light','They are radioactive'],'A closed shell is very stable.'],
['t','Why are alkali metals very reactive?','They have one electron outside a closed shell, which is easily lost',['They have a full shell','They have no electrons','They are heavy'],'A single outer electron is weakly bound.'],
['t','What would atoms be like without the Pauli principle?','All electrons would sit in the 1s level, with no chemistry as we know it',['Nothing would change','Atoms would be bigger','Atoms would have no mass'],'Shell structure would not exist.'],
['t','What did the Stern–Gerlach experiment show?','Spin (angular momentum) is quantized: the beam splits into discrete parts',['Light is a wave','Electrons have no mass','The nucleus is small'],'Silver atoms split into two beams.'],
['t','Two electrons in the same orbital must have:','opposite spins',['the same spin','different n','different energy'],'Otherwise all four quantum numbers would be the same.'],
['t','What keeps a white dwarf star from collapsing?','Electron degeneracy pressure, caused by the Pauli principle',['Gravity','Nuclear fusion only','Magnetic field only'],'Electrons cannot be squeezed into the same states.'],
['t','Particles with integer spin, such as photons, are called:','bosons',['fermions','leptons only','nucleons'],'Bosons do not obey the Pauli principle, while fermions do.']
/*Q10_END*/]},
{id:11,t:"Atomic and molecular structure",qs:[
['f','Rotational energy levels of a diatomic molecule (moment of inertia I):','E_J = ħ²J(J + 1)/(2I)',['E_J = ħ²J²/(2I)','E_J = ħ²J/(2I)','E_J = ħ²J(J + 1)/I'],'It follows from L² = ħ²J(J + 1) and E = L²/2I.'],
['f','Moment of inertia of a diatomic molecule (bond length r, reduced mass μ):','I = μr²',['I = (m₁ + m₂)r²','I = μr','I = m₁m₂r²'],'Two rotating atoms behave like one particle of mass μ at distance r.'],
['f','Reduced mass of a molecule made of two equal atoms of mass m:','m/2',['2m','m','m²'],'μ = m·m/(m + m) = m/2.'],
['f','Vibrational energy levels of a diatomic molecule:','E_v = ħω(v + ½)',['E_v = ħωv','E_v = ħω(v + 1)','E_v = ħωv²'],'It is the quantum harmonic oscillator.'],
['f','Vibration frequency of a molecule (force constant k, reduced mass μ):','ω = √(k/μ)',['ω = √(kμ)','ω = √(μ/k)','ω = k/μ'],'A stiffer bond gives a higher frequency, a heavier mass gives a lower one.'],
['f','The selection rule for rotational transitions:','ΔJ = ±1',['ΔJ = ±2','ΔJ = 0','ΔJ = ±3'],'A photon carries one unit of angular momentum.'],
['f','The selection rule for vibrational transitions (harmonic oscillator):','Δv = ±1',['Δv = ±2','Δv = 0','Δv = ±3'],'Only neighbouring levels are connected.'],
['f','The energy gap between the levels J and J + 1:','ΔE = ħ²(J + 1)/I',['ΔE = ħ²J/I','ΔE = ħ²/(2I)','ΔE = ħ²(J + 1)/(2I)'],'E_{J+1} − E_J = ħ²/(2I) · 2(J + 1).'],
['f','The order of the energy scales in a molecule:','E_rot ≪ E_vib ≪ E_el',['E_el ≪ E_vib ≪ E_rot','E_vib ≪ E_rot ≪ E_el','all are equal'],'Typical values: rotation ~10⁻³ eV, vibration ~0.1 eV, electrons ~ several eV.'],
['f','The zero-point vibrational energy of a molecule:','ħω/2',['0','ħω','3ħω/2'],'It is the energy of v = 0, and it cannot be removed.'],
['f','The total energy of a molecule in the simplest approximation:','E = E_el + E_vib + E_rot',['E = E_el·E_vib·E_rot','E = E_el − E_vib − E_rot','E = E_el only'],'The motions are treated as nearly independent.'],
['f','The reduced mass of a molecule doubles (same bond length). The rotational energies:','halve',['double','quadruple','do not change'],'E_J ∝ 1/I ∝ 1/μ.'],
['f','The bond length of a molecule is doubled. Its moment of inertia becomes:','4 times larger',['2 times larger','8 times larger','2 times smaller'],'I ∝ r².'],
['f','The ratio of E_J for J = 2 to that for J = 1:','3',['2','4','1.5'],'E₂/E₁ = [2·3]/[1·2] = 3.'],
['f','The spacing between neighbouring vibrational levels in the harmonic approximation:','ħω (the same for all)',['ħω/2','2ħω','grows with v'],'E_{v+1} − E_v = ħω.'],
['f','The force constant of a bond from the potential U(r) at its minimum r_e:','k = d²U/dr²',['k = dU/dr','k = U(r_e)','k = d³U/dr³'],'Near the minimum, U ≈ ½k(r − r_e)².'],
['f','Boltzmann population ratio of two levels (ΔE apart, equal degeneracy):','N₂/N₁ = e^(−ΔE/kT)',['N₂/N₁ = e^(ΔE/kT)','N₂/N₁ = e^(−kT/ΔE)','N₂/N₁ = ΔE/kT'],'Higher levels are less populated.'],
['f','The thermal energy kT at room temperature (300 K) is about:','0.026 eV',['0.26 eV','2.6 eV','0.0026 eV'],'k = 8.6·10⁻⁵ eV/K, times 300 K.'],
['f','The degeneracy of the rotational level J:','2J + 1',['J','2J','J + 1'],'It comes from the 2J + 1 values of the projection.'],
['f','A photon with energy 0.1 eV has a wavelength of about:','12.4 μm',['1.24 μm','124 μm','12.4 nm'],'λ = 1240 eV·nm/0.1 eV = 12 400 nm, in the infrared.'],
['t','What is a covalent bond?','A bond formed by shared electron pairs',['A bond by electron transfer','A bond by gravity','A bond between nuclei only'],'Examples: H₂, O₂, CH₄.'],
['t','What is an ionic bond?','Electrostatic attraction between ions formed by electron transfer',['Sharing of electrons','A magnetic bond','A nuclear bond'],'Example: Na⁺ and Cl⁻ in NaCl.'],
['t','What are van der Waals forces?','Weak forces between neutral molecules',['Strong covalent forces','Nuclear forces','Forces in metals only'],'They come from induced and fluctuating dipoles.'],
['t','What is a hydrogen bond?','Attraction between a hydrogen atom bound to O, N or F and another electronegative atom',['A bond between two H nuclei','A bond inside H₂','A covalent bond of carbon'],'It is responsible for many properties of water.'],
['t','Why do molecular spectra consist of bands?','Rotational levels sit on top of every vibrational level',['Molecules are cold','The molecule has no levels','Light is not quantized'],'Many close lines merge into a band.'],
['t','Pure rotational spectra lie in:','the microwave and far-infrared region',['the X-ray region','the visible range','gamma rays'],'Rotational energies are very small.'],
['t','Vibrational spectra lie mostly in:','the infrared region',['the X-ray region','the ultraviolet','radio waves'],'Typical energies are about 0.1 eV.'],
['t','Electronic transitions in molecules lie in:','the visible and ultraviolet region',['the microwave region','the radio range','the far infrared'],'The energy is a few eV.'],
['t','Why do N₂ and H₂ not absorb in the infrared or microwave region?','They have no permanent dipole moment',['They have no atoms','They are too heavy','They have no electrons'],'The photon needs to couple to a changing dipole.'],
['t','What is Raman scattering?','Inelastic scattering of light that changes the molecular state',['Elastic scattering of light','Reflection','Absorption of all light'],'The shift of the light frequency gives vibrational levels.'],
['t','A bonding molecular orbital has:','lower energy than the atomic orbitals it comes from',['higher energy','zero energy','the same energy'],'Electron density is concentrated between the nuclei.'],
['t','An antibonding orbital has:','higher energy and a node between the nuclei',['lower energy','no nodes','zero energy'],'Filling it weakens the bond.'],
['t','What does the Born–Oppenheimer approximation say?','Heavy nuclei move slowly, so the electron motion can be treated separately',['Nuclei move faster than electrons','Electrons do not move','Nuclei have no mass'],'It lets us define a potential energy curve.'],
['t','The equilibrium bond length corresponds to:','the minimum of the potential energy curve',['the maximum of the curve','zero distance','infinite distance'],'There the net force is zero.'],
['t','What is the dissociation energy?','The energy needed to split a molecule into atoms',['The energy of a photon','The energy of rotation','The energy of an electron in the atom'],'It is measured from the bottom of the well.'],
['t','What is anharmonicity?','Real vibrational levels get closer at high v, unlike the harmonic oscillator',['Levels move apart','Levels disappear','All levels are equal'],'The real potential is not a parabola.'],
['t','Why do heavy molecules have closely spaced rotational levels?','They have a large moment of inertia, and E ∝ 1/I',['They have a small I','They do not rotate','They have no spin'],'Larger I means smaller energy steps.'],
['t','What determines the chemical properties of an atom?','The outer (valence) electrons',['The nucleus mass','The inner electrons only','The neutrons'],'Valence electrons take part in bonding.'],
['t','What is the ionization energy?','The minimum energy needed to remove an electron from an atom',['The energy to add an electron','The energy of the nucleus','The energy of a photon only'],'For hydrogen it is 13.6 eV.'],
['t','What is the electron affinity?','The energy released when an atom attaches an extra electron',['The energy to remove an electron','The energy of a neutron','The energy of a bond in a crystal'],'It is large for halogens.']
/*Q11_END*/]},
{id:12,t:"Band theory. Semiconductors. p-n junction",qs:[
['f','The Fermi–Dirac distribution:','f(E) = 1/(e^((E − μ)/kT) + 1)',['f(E) = 1/(e^((E − μ)/kT) − 1)','f(E) = e^(−E/kT)','f(E) = 1/e^((E − μ)/kT)'],'The “+1” is for fermions; the “−1” would be for bosons.'],
['f','At T > 0, the probability that a state at the Fermi level is occupied:','1/2',['0','1','1/e'],'For E = μ, the exponent is zero and f = 1/(1 + 1).'],
['f','Conductivity of a semiconductor:','σ = e(nμₙ + pμₚ)',['σ = e(n + p)','σ = e·n·p/μ','σ = e(nμₙ − pμₚ)'],'Electrons and holes both carry current in the same direction.'],
['f','The intrinsic carrier density depends on temperature as:','nᵢ ∝ exp(−E_g/2kT)',['nᵢ ∝ exp(−E_g/kT)','nᵢ ∝ exp(E_g/2kT)','nᵢ ∝ 1/T'],'The Fermi level is in the middle, so each carrier needs E_g/2.'],
['f','A photon can create an electron–hole pair if:','hf ≥ E_g',['hf ≤ E_g','hf = 2E_g only','hf ≥ 2E_g'],'The photon must supply the energy to cross the gap.'],
['f','Silicon has E_g = 1.12 eV. The longest wavelength it absorbs is about:','1.1 μm',['550 nm','2.2 μm','11 μm'],'λ = 1240/1.12 ≈ 1107 nm.'],
['f','The law of mass action for a semiconductor in equilibrium:','n·p = nᵢ²',['n + p = nᵢ','n/p = nᵢ','n·p = nᵢ'],'More electrons mean fewer holes, and vice versa.'],
['f','An n-type sample has n = 10¹⁶ cm⁻³ and nᵢ = 10¹⁰ cm⁻³. The hole density is:','10⁴ cm⁻³',['10¹⁰ cm⁻³','10¹⁶ cm⁻³','10⁶ cm⁻³'],'p = nᵢ²/n = 10²⁰/10¹⁶ = 10⁴.'],
['f','The current–voltage law of an ideal diode:','I = I_s(e^(eV/kT) − 1)',['I = I_s(e^(eV/kT) + 1)','I = I_s(1 − e^(eV/kT))','I = I_s e^(−eV/kT)'],'It rises exponentially with forward V and saturates at −I_s in reverse.'],
['f','The thermal voltage kT/e at 300 K is about:','26 mV',['0.26 V','2.6 mV','1 V'],'0.026 eV divided by e.'],
['f','For a large reverse voltage, the diode current is about:','−I_s (a tiny saturation current)',['+I_s','0 exactly','infinite'],'e^(eV/kT) → 0, so I → −I_s.'],
['f','How the depletion width depends on the voltage:','w ∝ √(V_bi − V)',['w ∝ (V_bi − V)²','w ∝ 1/(V_bi − V)','w ∝ V_bi + V'],'Forward bias narrows it, and reverse bias widens it.'],
['f','The built-in potential of a p–n junction:','V_bi = (kT/e) ln(N_a N_d/nᵢ²)',['V_bi = (kT/e) ln(N_a + N_d)','V_bi = kT ln(N_a N_d)','V_bi = (e/kT) ln(N_a N_d/nᵢ²)'],'It grows with doping and falls with nᵢ.'],
['f','The forward voltage drop of a silicon diode is about:','0.7 V',['0.2 V','1.5 V','5 V'],'Germanium diodes have about 0.3 V.'],
['f','An LED has E_g = 1.9 eV. The emitted wavelength is about:','650 nm',['330 nm','1300 nm','2400 nm'],'λ = 1240/1.9 ≈ 653 nm, red light.'],
['f','The mobility of charge carriers is defined as:','μ = v_d/E',['μ = E/v_d','μ = v_d·E','μ = v_d/E²'],'It is the drift speed per unit electric field.'],
['f','μ = 0.14 m²/(V·s) and E = 100 V/m. The drift velocity is:','14 m/s',['0.0014 m/s','1400 m/s','140 m/s'],'v_d = μE = 0.14 · 100.'],
['f','Resistivity and conductivity are related by:','ρ = 1/σ',['ρ = σ','ρ = σ²','ρ = e/σ'],'They are inverse quantities.'],
['f','The Fermi level of an intrinsic semiconductor is:','near the middle of the band gap',['at the top of the valence band','at the bottom of the conduction band','deep in the conduction band'],'Electrons and holes are equally numerous.'],
['f','The Fermi level of an n-type semiconductor (T = 0) is:','just below the conduction band, near the donor level',['near the valence band','in the middle of the gap','above the conduction band'],'Extra electrons from donors fill states up to there.'],
['t','What does band theory say?','Atomic levels of N atoms in a solid broaden into bands',['Levels stay single','Electrons have no levels','All levels vanish'],'Between the bands are forbidden gaps.'],
['t','What is a metal in band theory?','A solid with a partially filled band',['A solid with a big gap and a full band','A solid with no bands','A solid with only holes'],'Electrons can easily move to nearby free states.'],
['t','What is an insulator in band theory?','A full valence band and a large gap (several eV)',['A half-filled band','No gap','A very small gap'],'Thermal energy cannot lift electrons across the gap.'],
['t','What is a semiconductor in band theory?','A full valence band and a small gap (about 1 eV)',['A half-filled band','A huge gap','No valence band'],'Heating or light can excite electrons across the gap.'],
['t','When a semiconductor is heated, its resistance:','decreases',['increases','does not change','becomes infinite'],'More carriers appear.'],
['t','When a metal is heated, its resistance:','increases',['decreases','does not change','becomes zero'],'Lattice vibrations scatter the electrons more.'],
['t','What is a hole?','An empty state in the valence band that behaves like a positive charge',['A hole in the crystal','A positron','A neutron'],'Neighbouring electrons hop into it, so the hole moves.'],
['t','An n-type semiconductor is made by adding:','donor atoms (group V, for example phosphorus)',['acceptor atoms','neutrons','only heat'],'Each donor gives an extra electron.'],
['t','A p-type semiconductor is made by adding:','acceptor atoms (group III, for example boron)',['donor atoms','protons','only light'],'Each acceptor creates a hole.'],
['t','Donor levels are located:','just below the conduction band',['just above the valence band','in the middle of the gap','inside the valence band'],'An electron easily goes up into the conduction band.'],
['t','Acceptor levels are located:','just above the valence band',['just below the conduction band','in the middle of the gap','in the conduction band'],'An electron from the valence band easily moves there, leaving a hole.'],
['t','What happens when a p–n junction is formed?','Carriers diffuse, leaving a depletion layer with a built-in electric field',['Nothing happens','All carriers vanish','Current flows forever'],'The field stops further diffusion at equilibrium.'],
['t','Forward bias of a p–n junction:','lowers the barrier and lets a large current flow',['raises the barrier','blocks all current','removes the junction'],'The p side is connected to the positive terminal.'],
['t','Reverse bias of a p–n junction:','widens the depletion layer; only a tiny current flows',['lets a large current flow','destroys the junction at once','narrows the depletion layer'],'Few minority carriers cross the junction.'],
['t','Why can a diode work as a rectifier?','It passes current in one direction only',['It stores charge','It amplifies voltage','It stops all current'],'Alternating current is converted to pulsating direct current.'],
['t','How does an LED emit light?','Electrons and holes recombine and emit photons',['The diode is heated','Photons are absorbed','Electrons collide with the nucleus'],'The photon energy is close to the gap E_g.'],
['t','How does a solar cell work?','Photons create electron–hole pairs that the junction field separates',['Heat produces current','The field absorbs light','It stores light'],'This creates a voltage across the cell.'],
['t','What is a Zener diode used for?','Voltage stabilization using reverse breakdown',['Light emission','Amplification','Heating'],'In breakdown, the voltage stays almost constant.'],
['t','What is a transistor used for?','Amplifying and switching signals',['Storing light','Producing heat','Measuring mass'],'It has two p–n junctions.'],
['t','What is the Fermi level?','The energy where the occupation probability is ½',['The highest energy in the atom','The lowest level in the band','The gap width'],'At T = 0, all states below it are filled and all above are empty.']
/*Q12_END*/]},
{id:13,t:"Thomson, Rutherford, nuclear constituents",qs:[
['f','Radius of a nucleus with the mass number A:','R = R₀A^(1/3)',['R = R₀A','R = R₀A²','R = R₀/A'],'The volume is proportional to A, so R grows as A^(1/3). R₀ ≈ 1.2 fm.'],
['f','The radius of a nucleus with A = 64 (R₀ = 1.2 fm) is:','4.8 fm',['9.6 fm','76.8 fm','0.3 fm'],'A^(1/3) = 4, so R = 1.2 · 4 = 4.8 fm.'],
['f','The density of nuclear matter is about:','2×10¹⁷ kg/m³',['10³ kg/m³','10⁹ kg/m³','10⁵ kg/m³'],'It is almost the same for all nuclei and is extremely high.'],
['f','The number of neutrons in a nucleus (mass number A, charge number Z):','N = A − Z',['N = A + Z','N = Z − A','N = A·Z'],'The mass number counts all nucleons.'],
['f','Uranium-235 has Z = 92. The number of neutrons is:','143',['327','92','235'],'N = 235 − 92 = 143.'],
['f','The Rutherford scattering cross-section depends on the angle as:','dσ/dΩ ∝ 1/sin⁴(θ/2)',['dσ/dΩ ∝ sin⁴(θ/2)','dσ/dΩ ∝ 1/sin²θ','dσ/dΩ ∝ θ²'],'Small angles are very common and large angles are rare.'],
['f','The closest approach of an α particle (energy K) in a head-on collision with a nucleus Z:','d = 2kZe²/K',['d = kZe²/K','d = K/(2kZe²)','d = 2kZe²·K'],'All the kinetic energy turns into the Coulomb energy k(2e)(Ze)/d.'],
['f','A 5 MeV α particle approaches a gold nucleus (Z = 79). The distance is about:','45 fm',['4.5 fm','455 fm','0.45 fm'],'d = 2 · 1.44 MeV·fm · 79/5 MeV ≈ 45 fm, bigger than the nuclear radius.'],
['f','The specific charge of the electron (Thomson’s e/m):','1.76×10¹¹ C/kg',['1.6×10⁻¹⁹ C/kg','9.1×10⁻³¹ C/kg','1.76×10⁻¹¹ C/kg'],'It is a large number because the electron is so light.'],
['f','The proton mass in terms of the electron mass:','about 1836 mₑ',['about 18 mₑ','about 183 mₑ','about 18 360 mₑ'],'The proton is almost 2000 times heavier.'],
['f','The atomic mass unit in energy units:','1 u = 931.5 MeV/c²',['1 u = 93.15 MeV/c²','1 u = 9315 MeV/c²','1 u = 0.9315 MeV/c²'],'It is used to convert the mass defect into energy.'],
['f','The mass defect of a nucleus (mass M):','Δm = Zm_p + Nm_n − M',['Δm = M − (Zm_p + Nm_n)','Δm = Zm_p − Nm_n','Δm = (Z + N)m_p − M'],'The sum of the free nucleons is heavier than the bound nucleus.'],
['f','The binding energy in terms of the mass defect:','E_b = Δm·c²',['E_b = Δm·c','E_b = Δm/c²','E_b = Δm·c³'],'It is Einstein’s relation.'],
['f','A nucleus has a mass defect of 0.03 u. The binding energy is:','27.9 MeV',['2.8 MeV','279 MeV','0.28 MeV'],'0.03 · 931.5 = 27.9 MeV.'],
['f','The binding energy per nucleon for most nuclei is about:','8 MeV',['0.8 MeV','80 MeV','800 MeV'],'It is almost constant from A ≈ 20 to A ≈ 200.'],
['f','A nucleus with A = 100 has 8.5 MeV per nucleon. Its total binding energy is:','850 MeV',['8.5 MeV','85 MeV','8500 MeV'],'100 · 8.5 = 850 MeV.'],
['f','The range of nuclear forces is about:','10⁻¹⁵ m',['10⁻¹⁰ m','10⁻⁵ m','infinite'],'This is of the order of the size of the nucleus.'],
['f','The radius of a nucleus with A = 8 compared to A = 1:','2 times larger',['8 times larger','4 times larger','2 times smaller'],'R ∝ A^(1/3), and 8^(1/3) = 2.'],
['f','The mass number is related to Z and N as:','A = Z + N',['A = Z − N','A = N − Z','A = Z·N'],'It is the total number of nucleons.'],
['f','1 femtometre (fm) equals:','10⁻¹⁵ m',['10⁻¹² m','10⁻¹⁸ m','10⁻⁹ m'],'The femtometre is the natural nuclear unit.'],
['t','What was Thomson’s model of the atom?','A positive sphere with electrons embedded in it',['A tiny nucleus with orbiting electrons','A solid neutral ball','A cloud of neutrons'],'It is the “plum pudding” model.'],
['t','What did Thomson discover?','The electron (cathode rays are made of particles)',['The proton','The neutron','The nucleus'],'He measured e/m with electric and magnetic fields.'],
['t','What was Rutherford’s experiment?','Scattering of α particles on a thin gold foil',['Diffraction of light','Heating gold','Deflecting electrons in a magnet'],'Geiger and Marsden counted scattered particles.'],
['t','What were the results of Rutherford’s experiment?','Most α particles passed, but a few were deflected through large angles',['All particles were stopped','All were deflected a little','All reflected back'],'A few even bounced almost straight back.'],
['t','What did Rutherford conclude?','The atom has a tiny, heavy, positively charged nucleus',['The atom is uniform','Electrons are in the nucleus','The atom is empty with no charge'],'Only a concentrated charge can strongly deflect an α particle.'],
['t','Why does Thomson’s model fail?','It cannot explain large-angle α scattering',['It has no electrons','It has no charge','It has no mass'],'A spread-out charge gives only small deflections.'],
['t','The nucleus is smaller than the atom by a factor of about:','10⁵',['10','10²','10¹⁰'],'About 10⁻¹⁵ m versus 10⁻¹⁰ m.'],
['t','What are nucleons?','Protons and neutrons',['Electrons and protons','Neutrons and electrons','Photons'],'They make up the nucleus.'],
['t','Who discovered the neutron?','Chadwick, in 1932',['Thomson','Bohr','Planck'],'It is a neutral particle with a mass close to the proton.'],
['t','What are isotopes?','Nuclei with the same Z and a different N',['Nuclei with the same N','Nuclei with the same A','Nuclei with different Z and the same N'],'They are the same chemical element.'],
['t','What are isobars?','Nuclei with the same A and a different Z',['Nuclei with the same Z','Nuclei with the same N','Nuclei with the same mass defect'],'Example: ¹⁴C and ¹⁴N.'],
['t','What are isotones?','Nuclei with the same N and a different Z',['Nuclei with the same Z','Nuclei with the same A','Identical nuclei'],'They have the same number of neutrons.'],
['t','The strong nuclear force is:','attractive, short-range and independent of charge',['long-range and repulsive','electric only','only gravitational'],'It acts between all nucleons.'],
['t','Why does the nucleus not fly apart despite the proton repulsion?','The strong nuclear force is stronger at short range',['Neutrons are charged','Gravity holds it','Electrons hold it'],'It beats the Coulomb repulsion inside the nucleus.'],
['t','The density of different nuclei is:','almost the same',['proportional to A','proportional to Z','zero'],'The volume grows in proportion to A.'],
['t','What is the binding energy of a nucleus?','The energy needed to split it into free nucleons',['The energy of its electrons','The energy of its decay','The energy of the atom'],'Higher binding energy means higher stability.'],
['t','What is the mass defect?','The nucleus mass is less than the sum of its free nucleons',['The nucleus is heavier','The nucleus has no mass','The mass of an electron'],'The missing mass was released as binding energy.'],
['t','Which nuclei are the most stable?','Those near iron (the maximum binding energy per nucleon)',['The lightest','The heaviest','Hydrogen'],'This is why both fusion and fission can release energy.'],
['t','Heavy stable nuclei have:','more neutrons than protons',['equal numbers','more protons','no neutrons'],'Extra neutrons dilute the Coulomb repulsion.'],
['t','What are “magic numbers” of nucleons?','2, 8, 20, 28, 50, 82, 126: nuclei with them are especially stable',['Numbers of electrons only','Random numbers','Numbers of isotopes'],'They correspond to closed nuclear shells.']
/*Q13_END*/]},
{id:14,t:"Radioactivity",qs:[
['f','The radioactive decay law:','N = N₀e^(−λt)',['N = N₀e^(λt)','N = N₀ − λt','N = N₀/(λt)'],'The decay rate is proportional to N, so N falls exponentially.'],
['f','Half-life in terms of the decay constant:','T½ = ln 2/λ',['T½ = λ ln 2','T½ = 1/λ','T½ = λ/ln 2'],'Set N = N₀/2 in the decay law.'],
['f','Mean lifetime of a nucleus:','τ = 1/λ',['τ = λ','τ = ln 2/λ','τ = 2/λ'],'After a time τ, N falls by a factor of e.'],
['f','Mean lifetime in terms of half-life:','τ = T½/ln 2 ≈ 1.44 T½',['τ = 0.69 T½','τ = 2 T½','τ = T½'],'The mean lifetime is longer than the half-life.'],
['f','Activity of a sample:','A = λN',['A = N/λ','A = λ/N','A = λN²'],'Each nucleus decays with probability λ per second.'],
['f','How does the activity change with time?','A = A₀e^(−λt)',['A = A₀e^(λt)','A = A₀ − λt','A = A₀/t'],'It follows N(t).'],
['f','T½ = 8 days. The fraction of nuclei left after 24 days is:','1/8',['1/3','1/4','1/16'],'24 days is 3 half-lives, and (1/2)³ = 1/8.'],
['f','T½ = 10 min. The fraction left after 5 min is about:','0.71',['0.5','0.25','0.87'],'2^(−0.5) = 0.707.'],
['f','T½ = 100 s. The decay constant is:','6.9×10⁻³ s⁻¹',['69.3 s⁻¹','0.69 s⁻¹','144 s⁻¹'],'λ = 0.693/100 s.'],
['f','A sample has 10⁶ nuclei and λ = 10⁻³ s⁻¹. The activity is:','1000 Bq',['10⁹ Bq','1 Bq','10⁻³ Bq'],'A = λN = 10⁻³ · 10⁶.'],
['f','One curie in becquerels:','3.7×10¹⁰ Bq',['3.7×10⁷ Bq','1 Bq','3.7×10¹³ Bq'],'It is the activity of 1 g of radium.'],
['f','In α decay, the nucleus (Z, A) becomes:','(Z − 2, A − 4)',['(Z − 1, A − 4)','(Z + 1, A)','(Z − 2, A − 2)'],'An α particle is ⁴₂He.'],
['f','In β⁻ decay, the nucleus (Z, A) becomes:','(Z + 1, A)',['(Z − 1, A)','(Z + 2, A − 4)','(Z, A − 1)'],'A neutron turns into a proton.'],
['f','In β⁺ decay, the nucleus (Z, A) becomes:','(Z − 1, A)',['(Z + 1, A)','(Z − 2, A − 4)','(Z, A + 1)'],'A proton turns into a neutron.'],
['f','²³⁸U (Z = 92) emits one α particle. The daughter nucleus is:','²³⁴Th',['²³⁸Pa','²³⁴Ra','²³⁸Th'],'Z = 90 is thorium, and A = 234.'],
['f','The energy released in α decay:','Q = (M_parent − M_daughter − M_He)c²',['Q = (M_daughter + M_He − M_parent)c²','Q = (M_parent + M_He)c²','Q = M_parent·c'],'It is positive when the products are lighter.'],
['f','The kinetic energy of the α particle (the daughter has mass number A − 4):','K_α ≈ Q·(A − 4)/A',['K_α ≈ Q·4/A','K_α ≈ Q/2','K_α = Q'],'The light α takes most of the energy, since momenta are equal.'],
['f','A nucleus decays through two channels with λ₁ and λ₂. The total decay constant:','λ = λ₁ + λ₂',['λ = λ₁λ₂','λ = (λ₁ + λ₂)/2','λ = λ₁ − λ₂'],'The probabilities per second add.'],
['f','How many half-lives are needed for the number of nuclei to fall to 1%?','about 6.6',['about 3.3','about 10','about 100'],'2⁻ⁿ = 0.01 gives n = log₂100 ≈ 6.64.'],
['f','A sample has 25% of its original ¹⁴C (T½ = 5730 y). Its age is:','11 460 years',['5730 years','22 920 years','17 190 years'],'25% is 2 half-lives, and 2 × 5730 = 11 460.'],
['t','What is radioactivity?','Spontaneous transformation of unstable nuclei with emission of radiation',['Heating by light','Chemical burning','Reflection of waves'],'It is not affected by the temperature or chemical state.'],
['t','Can we predict when a particular nucleus will decay?','No, decay is random; only the probability per second λ is known',['Yes, exactly','Yes, by temperature','Yes, by pressure'],'Statistics work well for large numbers of nuclei.'],
['t','What is an α particle?','A helium nucleus (2 protons and 2 neutrons)',['An electron','A photon','A neutron'],'It is heavy and has a charge of +2e.'],
['t','What is a β⁻ particle?','An electron emitted from the nucleus',['A proton','A helium nucleus','A photon'],'It appears when a neutron turns into a proton.'],
['t','What is γ radiation?','High-energy photons from the nucleus',['Electrons','Helium nuclei','Neutrons'],'The nucleus goes from an excited state to a lower one.'],
['t','How penetrating are α, β and γ radiation?','α stops in paper, β in aluminium, and γ needs thick lead',['γ stops in paper','α passes through lead','All are stopped by paper'],'γ is the most penetrating, and α is the least.'],
['t','Why is an antineutrino emitted in β⁻ decay?','To conserve energy, momentum and spin',['To charge the nucleus','To slow the electron','To create a photon'],'It explains the continuous energy spectrum of β particles.'],
['t','The energy spectrum of α particles from one nucleus is:','discrete (lines)',['continuous','zero','random'],'The α decay is a two-body process.'],
['t','The energy spectrum of β particles is:','continuous',['discrete lines','zero','single-valued'],'The energy is shared with the antineutrino.'],
['t','What is the half-life?','The time in which half of the nuclei decay',['The time to decay completely','The lifetime of one nucleus','The time for the activity to double'],'After each half-life, the number halves.'],
['t','How does the half-life depend on temperature and pressure?','It practically does not depend on them',['It increases with temperature','It decreases with pressure','It is zero'],'Nuclear processes are insensitive to such conditions.'],
['t','What is the becquerel?','One decay per second',['One decay per hour','One gram of radium','One electron volt'],'It is the SI unit of activity.'],
['t','What is a radioactive decay chain?','A series of decays ending in a stable nucleus (for example lead)',['A chain of atoms in a molecule','A circuit','A chemical reaction'],'The uranium series ends in ²⁰⁶Pb.'],
['t','Why is γ radiation often emitted after α or β decay?','The daughter nucleus is left in an excited state',['The electrons are excited','The atom is ionized','The nucleus is cooled'],'It gets rid of the extra energy by emitting a photon.'],
['t','What is electron capture?','The nucleus captures an inner electron, and a proton becomes a neutron',['The nucleus emits an electron','The nucleus emits a proton','An atom loses an electron'],'The atomic number decreases by 1.'],
['t','What explains α decay in quantum mechanics?','Tunnelling of the α particle through the barrier',['Collision with electrons','Gravity','Magnetic forces'],'This is Gamow’s theory.'],
['t','How does a Geiger counter detect radiation?','It detects the ionization of gas by the particles',['It measures mass','It measures heat only','It measures colour'],'Each ionizing particle produces a pulse of current.'],
['t','What is radiocarbon dating based on?','The decay of ¹⁴C with a half-life of 5730 years',['The decay of uranium only','The decay of oxygen','The melting of carbon'],'Living things keep a constant ¹⁴C fraction, and after death it decays.'],
['t','Which radiation ionizes matter the most per unit path?','α radiation (but it has a short range)',['γ radiation','Light','Radio waves'],'The α particle is slow, heavy and doubly charged.'],
['f','A free neutron decays with T½ ≈ 10.3 min. Its mean lifetime is about:','14.8 min',['7.1 min','10.3 min','20.6 min'],'The mean lifetime is τ = T½/ln 2 ≈ 1.44·T½ = 1.44 × 10.3 min ≈ 14.8 min (about 890 s), which corresponds to the decay constant λ = 1/τ ≈ 0.067 min⁻¹. The mean lifetime is always longer than the half-life: the option 7.1 min wrongly multiplies by ln 2, and 10.3 min confuses τ with T½.']
/*Q14_END*/]},
{id:15,t:"Energetics of nuclear reactions",qs:[
['f','The Einstein mass–energy relation:','E = mc²',['E = mc','E = m²c','E = ½mc²'],'A body of mass m at rest has the energy E = mc², where c ≈ 3×10⁸ m/s. Any change of rest energy ΔE corresponds to a change of mass Δm = ΔE/c². E = mc has the units of momentum, not energy, and ½mc² mixes rest energy with the kinetic-energy formula ½mv².'],
['f','The energy equivalent of 1 kg of mass is:','9×10¹⁶ J',['3×10⁸ J','9×10⁸ J','3×10²⁴ J'],'E = mc² = 1 kg × (3×10⁸ m/s)² = 9×10¹⁶ J. This is roughly the energy of 20 megatons of TNT. The option 3×10⁸ J forgets to square c, and 9×10⁸ J squares only the number 3 but not the power of ten.'],
['f','Mass defect of a nucleus with Z protons, N neutrons and mass M:','Δm = Zm_p + Nm_n − M',['Δm = M − Zm_p − Nm_n','Δm = Zm_p − Nm_n + M','Δm = (Z + N)·M'],'A bound nucleus is lighter than its separate nucleons, so the mass defect is “free parts minus the whole” and it is always positive. If you use atomic masses from a table, take the mass of the hydrogen atom instead of m_p so that the electron masses cancel.'],
['f','Nuclear binding energy in terms of the mass defect:','E_b = Δm·c²',['E_b = Δm·c','E_b = Δm/c²','E_b = M·c²'],'The mass defect is the mass that left the system as energy when the nucleus was formed, so E_b = Δm·c². It is also the minimum work needed to take the nucleus apart into free nucleons. With Δm in u this becomes E_b[MeV] = Δm[u] × 931.5. The expression M·c² is the total rest energy of the nucleus, not its binding energy.'],
['f','The atomic mass unit expressed in energy units:','1 u ≈ 931.5 MeV/c²',['1 u ≈ 0.511 MeV/c²','1 u ≈ 9.3 MeV/c²','1 u ≈ 13.6 eV/c²'],'1 u = 1.6605×10⁻²⁷ kg. Multiplying by c² gives 1.49×10⁻¹⁰ J, and dividing by 1.602×10⁻¹³ J/MeV gives 931.5 MeV. This one number converts every mass defect in u into energy in MeV. The 0.511 MeV in the options is the rest energy of the electron, and 13.6 eV is the ionization energy of hydrogen.'],
['f','For the α particle Δm = 0.0304 u. Its binding energy is:','28.3 MeV',['0.0304 MeV','3.3 MeV','283 MeV'],'E_b = 0.0304 u × 931.5 MeV/u = 28.3 MeV. This is the energy released when 2 protons and 2 neutrons combine into ⁴He, and the energy that must be supplied to split ⁴He back into four nucleons.'],
['f','Binding energy per nucleon of ⁴He (E_b = 28.3 MeV):','about 7.1 MeV',['about 28.3 MeV','about 14 MeV','about 0.9 MeV'],'Divide by the number of nucleons: 28.3 MeV / 4 ≈ 7.1 MeV. This is far higher than for the deuteron (about 1.1 MeV) or tritium (about 2.8 MeV), which is why fusion that ends in ⁴He releases so much energy.'],
['f','The deuteron has E_b = 2.23 MeV. The binding energy per nucleon is:','about 1.1 MeV',['about 2.2 MeV','about 4.5 MeV','about 0.5 MeV'],'The deuteron has 2 nucleons, so 2.23 MeV / 2 ≈ 1.1 MeV per nucleon. The same 2.23 MeV is released when a free proton and a free neutron merge into a deuteron. The option 2.2 MeV forgets to divide by the number of nucleons.'],
['f','The energy released in a nuclear reaction (Q value):','Q = (Σm_in − Σm_out)c²',['Q = (Σm_out − Σm_in)c²','Q = Σm·c','Q = Δm/c²'],'Q is the rest energy before the reaction minus the rest energy after it. If the products are lighter, Q > 0 and the reaction releases energy. If they are heavier, Q < 0 and the reaction proceeds only if the projectile brings in extra kinetic energy. The reversed difference gives the wrong sign.'],
['f','For D + T → ⁴He + n the mass defect is Δm ≈ 0.0189 u. The energy released is:','about 17.6 MeV',['about 1.76 MeV','about 176 MeV','about 0.0189 MeV'],'Q = 0.0189 u × 931.5 MeV/u ≈ 17.6 MeV. The masses used are D = 2.01410 u, T = 3.01605 u, ⁴He = 4.00260 u and n = 1.00867 u, so the products are lighter than the reactants by 0.0189 u. Always check the order of magnitude: a mass defect of a few hundredths of u is a few tens of MeV.'],
['f','One fission event of ²³⁵U releases about:','200 MeV',['2 MeV','20 MeV','2000 MeV'],'Estimate: ²³⁶U has about 7.6 MeV per nucleon, the fragments (A ≈ 118) about 8.5 MeV per nucleon. The gain is ≈ 0.9 MeV × 236 ≈ 200 MeV. A chemical reaction gives only a few eV per molecule, so nuclear energy per atom is tens of millions of times larger.'],
['f','Complete the reaction n + ²³⁵U → ¹⁴⁰Xe + ⁹⁴Sr + x·n. The number x is:','2',['1','3','0'],'Balance the mass number: 1 + 235 = 236 on the left, and 140 + 94 + x = 236 gives x = 2. The charge also balances: 92 = 54 + 38. The number of neutrons varies from event to event (on average about 2.4 per fission), but for this pair of fragments it is exactly 2.'],
['f','The fragment ⁹⁴Sr (Z = 38) ends as stable ⁹⁴Zr (Z = 40). The number of β⁻ decays on the way is:','2',['1','4','0'],'Each β⁻ decay turns a neutron into a proton: Z grows by 1 and A stays the same. To go from Z = 38 to Z = 40 two decays are needed: ⁹⁴Sr → ⁹⁴Y → ⁹⁴Zr. Fission fragments are neutron-rich, so they typically decay through such chains of β⁻ decays.'],
['f','The net result of the whole proton–proton cycle in stars:','4p → ⁴He + 2e⁺ + 2ν + energy',['2p → ²H + γ','4p → ⁴He + 4n','⁴He → 4p + energy'],'Four protons become one α particle. Check the charge: 4e on the left, and 2e (⁴He) + 2e (two positrons) = 4e on the right. The two neutrinos carry away a small part of the energy. The other options either skip the end of the chain, break charge conservation, or run the process in reverse.'],
['f','Energy released in one complete proton–proton cycle:','about 25 MeV',['about 0.4 MeV','about 250 MeV','about 2.5 keV'],'The first two steps occur twice for every ³He + ³He reaction: 2×0.4 MeV + 2×5.5 MeV + 13.0 MeV ≈ 25 MeV. The 0.4 MeV is only the first step, and 250 MeV is the scale of fission, which is a heavier-nucleus process.'],
['f','In D + T → ⁴He + n the 17.6 MeV is shared so that most of it is carried by:','the neutron (about 14 MeV)',['the α particle (about 14 MeV)','both products equally','the emitted photons'],'The total momentum is zero, so the neutron and the α particle have equal and opposite momenta p. Kinetic energy is K = p²/2m, so the lighter particle gets more: K_n : K_α = m_α : m_n ≈ 4 : 1. That gives about 14 MeV for the neutron and 3.5 MeV for ⁴He. This is why the neutron carries the energy out of a fusion reactor.'],
['f','Which step of the proton cycle releases the most energy (per the lecture)?','³He + ³He → ⁴He + 2p, 13.0 MeV',['p + p → ²H + e⁺ + ν, 0.4 MeV','²H + p → ³He + γ, 5.5 MeV','all steps release the same'],'The three steps release 0.4 MeV, 5.5 MeV and 13.0 MeV. The last one forms the stable ⁴He nucleus and returns two protons to the cycle, so it is the most energetic. The first step is slow and weak because it needs a proton to turn into a neutron.'],
['f','The fraction of hydrogen in seawater that is deuterium:','about 1 part in 5000',['about 1 part in 5','about 1 part in 100','about 1 part in 10⁹'],'About 1 hydrogen atom in 5000 in seawater is deuterium, which is over 10¹⁵ tons in all the oceans. According to the lecture, the deuterium in one gallon of seawater could give as much energy as 300 gallons of gasoline. So the deuterium side of D–T fuel is practically unlimited.'],
['f','Tritium is bred from lithium-6 by slow neutrons. The reaction is:','n + ⁶Li → ⁴He + ³H',['p + ⁶Li → ⁴He + ³H','n + ⁶Li → ⁸Be + e⁻','n + ⁶Li → ⁴He + ³He'],'Check both A and Z. The correct reaction: A 1 + 6 = 4 + 3, charge 3 = 2 + 1. In the first wrong option the charge is not conserved (1 + 3 = 4 against 2 + 1 = 3), in the second the mass number is wrong (7 against 8), and in the last the charge is wrong (3 against 4). The reaction works with slow neutrons, so a lithium blanket around the reactor can make tritium.'],
['f','The activity of ¹³¹I (T½ = 8 days) after 80 days is about this fraction of the initial value:','0.1% (1/1024)',['10%','1%','0.01%'],'80 days is 10 half-lives, so the fraction is 2⁻¹⁰ = 1/1024 ≈ 0.1%. That is why iodine-131 gives a high initial dose but is soon gone, unlike ¹³⁷Cs and ⁹⁰Sr with half-lives of about 30 years.'],
['t','Why is the mass of a nucleus smaller than the sum of the masses of its nucleons?','Binding releases energy, which carries away mass according to E = Δmc²',['Some nucleons turn into neutrinos','Neutrons lose mass in the nucleus','The mass is measured with an error'],'When nucleons bind together, the system gives off the binding energy and, by E = mc², loses the corresponding mass. The nucleons are not destroyed and do not shrink. To take the nucleus apart you must supply the same energy, and the mass returns.'],
['t','Where does the binding energy per nucleon have its maximum?','Near iron, A ≈ 56 (about 8.8 MeV per nucleon)',['Near hydrogen, A = 1','Near uranium, A ≈ 238','At helium only, A = 4'],'The curve rises quickly for light nuclei, has a broad maximum of about 8.8 MeV per nucleon around iron and nickel, and slowly falls to about 7.6 MeV for uranium. Nuclei near the maximum are the most stable: no fission or fusion of them releases energy. ⁴He is only a local peak on the rising part.'],
['t','Why does fission of a heavy nucleus release energy?','The fragments have more binding energy per nucleon than the parent nucleus',['The fragments have fewer protons','The parent nucleus is lighter than the fragments','Neutrons are created from nothing'],'Heavy nuclei are on the falling side of the binding-energy curve. After splitting, each nucleon sits in a more tightly bound nucleus, so the total mass decreases and the difference is released as energy. The total number of nucleons is conserved, and the combined mass of the fragments is less than that of the parent.'],
['t','Why does fusion of light nuclei release energy?','The product lies higher on the binding-energy curve, with more binding per nucleon',['Light nuclei have no Coulomb repulsion','Fusion creates new protons','The nuclear force becomes weaker'],'For small A the curve rises with A, so a heavier product is more tightly bound per nucleon than the starting nuclei, and the mass difference is released as energy. Fusion and fission both move nuclei toward the maximum of the curve near iron, one from the left and the other from the right.'],
['t','What does the liquid-drop model say about why large nuclei undergo fission?','Two fragments have a much smaller total Coulomb repulsion than the single parent nucleus',['Fission removes the surface tension','Neutrons repel each other strongly','Large nuclei have no strong force'],'The Coulomb energy grows as Z², so splitting the charge into two halves reduces it considerably. In a large nucleus this gain beats the extra surface energy of two drops. The Coulomb term alone favours equal halves, but real fission usually gives fragments of unequal sizes.'],
['t','Why does the energy of a nucleus first rise when the fragments start to separate?','The surface energy increases while the Coulomb energy hardly changes',['The strong force becomes stronger','Neutrons are absorbed','The nucleus gains electrons'],'As the drop stretches and necks off, its surface area increases, so the surface energy rises first, while the Coulomb energy has not yet fallen much. This produces a potential barrier. Only later, when the fragments are far apart, does the lower Coulomb energy make the whole process favourable.'],
['t','How does the spontaneous fission of a nucleus happen?','The nucleus tunnels through the fission barrier without any outside particle',['A neutron is captured first','The nucleus is heated above 10⁶ K','Gamma rays push it apart'],'Because of the barrier, the nucleus should not split on its own, but quantum tunnelling allows it with a small probability per second. In induced fission the barrier is overcome by the excitation energy that a captured neutron brings in. This is the difference between spontaneous and induced fission.'],
['t','How is the induced fission of ²³⁵U started?','A neutron is captured and the excited ²³⁶U nucleus then splits',['A proton is captured by the nucleus','The nucleus emits an α particle','An electron hits the nucleus'],'²³⁵U captures a free neutron and becomes ²³⁶U in an excited state. This excitation is enough to push the nucleus over the fission barrier, and it splits into two fragments and releases 2–3 neutrons. A neutron has no charge, so it is not repelled by the Coulomb force and even a slow one can be captured.'],
