<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physics II · Interactive 3D Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--al:42%;--bg:#f4f6fb;--card:#fff;--soft:#eef2f9;--tx:#0f1b33;--mu:#5a6780;--ln:#dde3ee;--ac:#2447f0;--on:#fff;--ok:#0f9d58;--okb:#e3f6ec;--no:#d92d43;--nob:#fde8eb;--sh:0 1px 2px rgba(15,27,51,.05),0 8px 20px -10px rgba(15,27,51,.14);--r:14px;--sf:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--se:"Source Serif 4",Georgia,"Times New Roman",serif;box-sizing:border-box;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--al:72%;--bg:#0a111f;--card:#111a2c;--soft:#16213a;--tx:#e9eefb;--mu:#98a6c2;--ln:#243350;--ac:#7f9cff;--on:#0a111f;--ok:#3ccf86;--okb:#0f2e20;--no:#ff6b7d;--nob:#3a1620;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 24px -12px rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{--al:72%;--bg:#0a111f;--card:#111a2c;--soft:#16213a;--tx:#e9eefb;--mu:#98a6c2;--ln:#243350;--ac:#7f9cff;--on:#0a111f;--ok:#3ccf86;--okb:#0f2e20;--no:#ff6b7d;--nob:#3a1620;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 24px -12px rgba(0,0,0,.65);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--sf);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:420px;background:radial-gradient(900px 300px at 50% -120px,color-mix(in srgb,var(--ac) 11%,transparent),transparent);pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:clamp(2.1rem,6vw,3rem);line-height:1.02;margin:0;font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(1.5rem,4vw,1.9rem);line-height:1.15;margin:6px 0 4px;letter-spacing:-.02em;font-weight:800}
button,input,select{font:inherit;color:inherit}button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu);font-size:.92rem}.msg{font-size:.9rem;color:var(--no);margin-top:8px}
.num{font-size:.78rem;color:var(--ac);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:8px}

/* ---- top bar ---- */
#top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:960px;margin:0 auto;height:56px;padding:0 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:6px 8px 6px 0;cursor:pointer;font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.brand svg{width:26px;height:26px;flex:none}
.crumb2{color:var(--mu);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb2:not(:empty)::before{content:"/";margin-right:10px;opacity:.5}
.sp{flex:1}
.who{display:flex;align-items:center;gap:7px;font-size:.9rem;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.who i.warn{background:var(--no)}
.icon{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid var(--ln);background:var(--card);cursor:pointer;color:var(--tx);transition:border-color .15s,background .15s}
.icon:hover{border-color:var(--ac)}.icon svg{width:19px;height:19px}

/* ---- buttons / inputs ---- */
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:11px 20px;min-height:44px;cursor:pointer;font-weight:700;transition:filter .15s,transform .1s,border-color .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln);font-weight:600}.btn.g:hover:not(:disabled){border-color:var(--ac);filter:none}
.btn.d{background:var(--nob);color:var(--no);border:1px solid var(--no)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:.92rem}.btn:disabled{opacity:.4;cursor:default}
.back{color:var(--ac);cursor:pointer;background:none;border:0;padding:6px 0;font-weight:700;min-height:36px}.back:hover{text-decoration:underline}
input[type=text],input[type=password],input[type=search]{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:11px 14px;min-height:44px;min-width:0;flex:1 1 170px}
input:focus{border-color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.seg{display:inline-flex;gap:2px;padding:4px;background:var(--soft);border:1px solid var(--ln);border-radius:12px}
.seg button{background:none;border:0;padding:8px 18px;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:600;min-height:38px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh);font-weight:700}
.seg.sm button{padding:6px 14px;min-height:34px;font-size:.92rem}

/* ---- surfaces ---- */
.box{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:20px;margin-top:14px;box-shadow:var(--sh)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.pill.prog{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,var(--ln));background:color-mix(in srgb,var(--ac) 8%,transparent)}
.pill.done{color:var(--ok);border-color:var(--ok);background:var(--okb)}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--soft);color:var(--mu);letter-spacing:.02em}
.foot{margin-top:34px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---- home ---- */
.hero2{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:28px;border-radius:20px;border:1px solid var(--ln);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 10%,var(--card)),var(--card) 62%);box-shadow:var(--sh);position:relative;overflow:hidden}
.hero2 .hl{max-width:480px;position:relative;z-index:1}.lead{margin:10px 0 0;color:var(--mu);font-size:1.05rem}
.hwave{position:absolute;left:0;right:0;bottom:0;height:70px;opacity:.5;pointer-events:none}.hwave svg{width:100%;height:100%;display:block}
.w0{fill:none;stroke:var(--ln);stroke-width:2;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.w1{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ring{position:relative;width:132px;height:132px;flex:none;z-index:1}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rb{fill:none;stroke:var(--soft);stroke-width:10}.ring .rf{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}.rt b{font-size:1.9rem;font-weight:800;letter-spacing:-.03em}.rt span{font-size:.74rem;color:var(--mu);margin-top:4px}
.banner,.sync{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);margin-top:14px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;flex-wrap:wrap;font-size:.94rem;color:var(--mu)}
.sync{padding:18px;display:grid;gap:14px;box-shadow:var(--sh)}.sync-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.sync .row{margin:0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.tools input{flex:1 1 220px;max-width:340px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:6px 14px;min-height:36px;cursor:pointer;color:var(--mu);font-weight:600;font-size:.9rem;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--ac);color:var(--tx)}.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.grp{margin-top:26px}.grp>h3{margin:0 0 10px;font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:10px}.grp>h3::after{content:"";flex:1;height:1px;background:var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.lc{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:var(--r);padding:14px 16px 15px;cursor:pointer;box-shadow:var(--sh);transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .15s,box-shadow .18s}
.lc:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 14px 26px -16px var(--ac)}
.lc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lc b{font-size:1.05rem;line-height:1.28;letter-spacing:-.01em;min-height:2.56em;display:block}
.hid{display:none!important}.empty{padding:40px 0;text-align:center;color:var(--mu)}

/* ---- leaderboard ---- */
.lbr{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px}.lbr:nth-child(odd){background:var(--soft)}
.lbr.me{outline:2px solid var(--ac)}.lbn{min-width:1.6em;font-weight:800;color:var(--ac)}
.lbu{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbs{font-weight:700}

/* ---- lecture page ---- */
.mh{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:22px 24px;border-radius:20px;border:1px solid var(--ln);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 10%,var(--card)),var(--card) 62%);box-shadow:var(--sh);margin-top:6px}
.mh h2{margin:6px 0 10px}.stats{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--mu);font-size:.92rem}.stats b{color:var(--tx)}
.mh .ring{width:96px;height:96px}.mh .rt b{font-size:1.4rem}
.stepnav{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:4px;margin:16px 0 0;padding:5px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:12px;box-shadow:var(--sh)}
.stepnav button{flex:1;background:none;border:0;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:600;min-height:40px;transition:background .15s,color .15s;white-space:nowrap}
.stepnav button:hover{background:var(--soft);color:var(--tx)}.stepnav button.on{background:var(--ac);color:var(--on);font-weight:700}
.step{margin-top:34px;scroll-margin-top:130px}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:14px}.sh b{font-size:1.25rem;letter-spacing:-.01em;display:block}
.sn{flex:none;width:34px;height:34px;border-radius:10px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--sh);transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .15s}
.tile:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ac)}.tile:disabled{opacity:.4;cursor:default}
.tile b{font-size:1.05rem;letter-spacing:-.01em}.ti{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);font:800 1.15rem/1 var(--se);margin-bottom:8px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pager button{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;cursor:pointer;min-height:64px;transition:border-color .15s}
.pager button:hover{border-color:var(--ac)}.pager button:last-child{text-align:right;align-items:flex-end}.pager b{font-size:.98rem;line-height:1.3}

/* ---- theory ---- */
.tfig{margin:0 0 12px;border:1px solid var(--ln);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:var(--sh)}
.tfig svg{display:block;width:100%;height:auto}
.tfig .tt{stroke:var(--mu);fill:none;stroke-width:1.5}.tfig .ts{stroke:var(--ac);fill:none;stroke-width:3;stroke-linecap:round}.tfig .ts2{stroke:var(--mu);fill:none;stroke-width:3;opacity:.7}.tfig .td{fill:var(--ac)}.tfig .td2{fill:var(--mu)}
.tb{border-left:4px solid var(--ac)}.tb>b{display:block;font-size:1.1rem;letter-spacing:-.01em;margin-bottom:6px}
.tb.k>b::before{content:"★ ";color:var(--ac)}.tb.e>b::before{content:"⚠ ";color:var(--no)}
.fl{margin:8px 0 0;padding:0;list-style:none;font:400 1.04rem/1.6 var(--se)}
.fl li{padding:7px 12px;margin-bottom:6px;border-left:3px solid color-mix(in srgb,var(--ac) 55%,transparent);background:var(--soft);border-radius:0 8px 8px 0}
.sec{margin-top:14px}
@keyframes tsh{to{transform:translateX(-100px)}}@keyframes tsh2{to{transform:translateX(-160px)}}@keyframes tob{from{transform:translateX(-60px)}to{transform:translateX(60px)}}@keyframes tro{to{transform:rotate(360deg)}}@keyframes tda{to{stroke-dashoffset:-24}}@keyframes tdr{0%{stroke-dashoffset:500}70%,100%{stroke-dashoffset:0}}@keyframes tjp{0%,20%{transform:translateY(0);opacity:1}60%{transform:translateY(-62px)}90%,100%{transform:translateY(-62px);opacity:0}}
.tw1{animation:tsh 2s linear infinite}.tw2{animation:tsh2 3.2s linear infinite}.tob{animation:tob 1.6s ease-in-out infinite alternate}
.tr1{transform-origin:200px 50px;animation:tro 3s linear infinite}.tr2{transform-origin:200px 50px;animation:tro 5s linear infinite reverse}
.try{stroke-dasharray:8 6;animation:tda .8s linear infinite}.tdc{stroke-dasharray:500;animation:tdr 4s ease-out infinite}.tjp{animation:tjp 3s ease-in-out infinite}
.paper{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:24px 22px 8px;box-shadow:var(--sh);column-width:270px;column-gap:30px}
.ms{break-inside:avoid;margin-bottom:22px}.ms h3{margin:0 0 4px;font-size:1.05rem;border-bottom:2px solid var(--ac);padding-bottom:5px;display:flex;gap:8px}
.ms .sec{margin-top:8px}.ms .sec>b{font-size:.82rem;color:var(--mu)}.ms .fl{font-size:.95rem;line-height:1.45}.ms .fl li{padding:3px 0 3px 10px;margin-bottom:3px}
@media print{body{background:#fff}body::before,#top,.tabs,.row,.nav,.sync,.banner,.foot,.seg{display:none!important}.paper{box-shadow:none;border:0;padding:0;color:#000}.ms .fl li{background:none}}

/* ---- quiz ---- */
.qwrap{max-width:720px;margin:0 auto}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qbar{margin:6px 0 4px}.qbar.bar{height:8px}
.q{font:600 1.28rem/1.5 var(--se);margin:14px 0 20px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:13px 16px;margin-bottom:10px;cursor:pointer;font:400 1.06rem/1.45 var(--se);transition:border-color .15s,background .15s,transform .15s}
.opt b{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font:700 .86rem var(--sf);color:var(--ac)}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(3px)}.opt:disabled{cursor:default;color:inherit}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{background:var(--nob);border-color:var(--no)}.opt.no b{background:var(--no);color:#fff}
.verdict{display:flex;gap:14px;align-items:flex-start;margin-top:18px;padding:14px 16px;border-radius:12px;border:1px solid}
.verdict.ok{background:var(--okb);border-color:var(--ok)}.verdict.no{background:var(--nob);border-color:var(--no)}
.vi{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}.ok .vi{background:var(--ok)}.no .vi{background:var(--no)}
.verdict b{font-size:1.05rem}.verdict div div{font-size:.98rem}
.ex{margin-top:14px;padding:14px 18px;border-left:3px solid var(--ac);background:var(--soft);border-radius:0 10px 10px 0;font:400 1.02rem/1.65 var(--se)}
.ex b{font-family:var(--sf)}.ex p{margin:6px 0 0}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:700}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--ac);border-bottom:2px solid var(--ac);transform:rotate(-45deg);transition:transform .2s}
details[open]>summary::before{transform:rotate(45deg)}
.why{margin-top:10px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 16px}
.why>summary{font-size:.96rem;min-height:30px}.why .fl{font-size:.97rem}.why .ex{margin-top:8px}.why .tb{margin-top:10px;box-shadow:none}
.dock{position:sticky;bottom:0;margin:18px -20px -20px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--card) 28%);display:flex;align-items:center;gap:14px;border-radius:0 0 var(--r) var(--r)}
.dock .btn{flex:1;max-width:240px}
.res{text-align:center;padding:30px 20px}.res .ring{margin:10px auto 14px;width:150px;height:150px}.res .rt b{font-size:2.2rem}.res h2{margin:6px 0 2px}.res .row{justify-content:center}
.big{font-size:1.1rem;color:var(--mu)}

/* ---- visual lab ---- */
.sims{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sims[data-solo]{display:none}
.sb{background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;color:var(--mu);transition:all .15s}
.sb:hover{border-color:var(--ac);color:var(--tx)}
.sb.on{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:700}
.labbox{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;display:grid;gap:14px;box-shadow:var(--sh)}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 18px;align-items:end}
.ctl{display:grid;gap:4px;font-size:.86rem;color:var(--mu)}.ctl span{display:flex;justify-content:space-between;gap:8px}.ctl b{color:var(--tx);font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--ac);height:30px;cursor:pointer}
.ctl select{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px;min-height:40px;color:var(--tx);font:inherit}
.labbox canvas{width:100%;height:380px;display:block;border-radius:10px;background:var(--bg);border:1px solid var(--ln)}
.rd{font-family:var(--se);font-size:1.04rem;min-height:1.5em;line-height:1.55;padding:2px 2px}.rd b{color:var(--ac)}
.hint{display:none}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.how>div{background:var(--soft);border-left:3px solid var(--ac);border-radius:0 10px 10px 0;padding:11px 15px}
.how b{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ac)}.how p{margin:4px 0 0;font:400 1rem/1.55 var(--se)}
.v3{display:none;height:400px;border-radius:10px;overflow:hidden;position:relative;touch-action:none;cursor:grab;border:1px solid var(--ln);background:linear-gradient(180deg,#0f1a30,#070c18)}
.v3 canvas{display:block;width:100%!important;height:100%!important;border:0!important;border-radius:0!important;background:transparent!important}

osc:{t:'Spring / Pendulum',m:1,h:'Choose Ω ≈ ω₀ with F₀ > 0 to see resonance (amplitude grows); increase β to damp it. x(t), v(t), a(t) are shown live: v leads x by π/2, a is opposite to x.',
 c:[['ty','System',['Mass on spring','Pendulum']],['m','Mass m, kg',.2,5,.1,1],['k','Stiffness k, N/m (pendulum: mg/l)',1,100,1,20],['b','Damping β, 1/s',0,3,.05,.2],['F','Drive F₀, N',0,20,.5,0],['w','Drive frequency Ω, rad/s',.5,15,.1,4.5],['r','Reset','btn']],

wave:{t:'Waves · Doppler',m:2,h:'Travelling: ξ = A sin(kx − ωt), speed v = λf. Standing: two opposite waves give nodes (red) every λ/2 and antinodes (green). Doppler: fronts bunch up ahead of the source.',

 init(p){p.t=0;p.fr=[];p.sx=60;p.em=0},

lens:{t:'Thin lens',m:4,h:'1/s + 1/s′ = 1/f. Move the object inside the focal length (s < f) and the image becomes virtual, upright and magnified (dashed rays).',
 c:[['f','Focal length f, cm',4,15,.5,8],['s','Object distance s, cm',3,30,.5,18],['ho','Object height, cm',1,5,.5,3]],init(){},
 d({x,w,h,p,c,out}){const u=Math.min(14,(w/2-24)/30),cx=w/2,y0=h/2,sp=1/(1/p.f-1/p.s),real=sp>0,hi=-p.ho*sp/p.s,T=[cx-p.s*u,y0-p.ho*u],I=[cx+sp*u,y0-hi*u];

pauli:{t:'Electron configuration',m:10,h:'Aufbau + Pauli + Hund: each orbital holds 2 electrons with opposite spins; degenerate orbitals fill singly with parallel spins first. Fill order 1s 2s 2p 3s 3p 4s 3d 4p. Try Z = 24 (Cr is an exception in real life: 4s¹3d⁵).',

const MODS=[
{id:1,t:"Free harmonic vibrations",qs:[
['f','Released from maximum displacement at t = 0, the displacement is:','x = A cos ωt',['x = A sin ωt','x = A ωt','x = A e^(−ωt)'],'The general solution is x = A cos(ωt + φ). At t = 0 the body is released from rest at maximum displacement, so x(0) = A. That requires cos φ = 1, so φ = 0 and x = A cos ωt. A sine would give x(0) = 0, which describes a start from the equilibrium position, not from the extreme point. The other options are not oscillations: ωt only grows, and e^(−ωt) only decays.'],
['f','Relation between period T and angular frequency ω:','T = 2π/ω',['T = ω/2π','T = 2πω','T = 1/(2πω)'],'During one period the phase ωt grows by exactly one full cycle, 2π. So ωT = 2π and T = 2π/ω. Quick check: ω = 2π rad/s gives T = 1 s. The inverted forms have the wrong units: ω/2π is in rad/s, not in seconds.'],
['f','Relation between ω and frequency f:','ω = 2πf',['ω = f/2π','ω = πf','ω = f²'],'Frequency f counts cycles per second, and every cycle is 2π radians of phase. So the phase changes at 2π·f radians per second, which is ω = 2πf. This is the same as ω = 2π/T because f = 1/T. Example: f = 50 Hz gives ω ≈ 314 rad/s.'],
['f','Maximum velocity in SHM:','v_max = Aω',['v_max = Aω²','v_max = A/ω','v_max = A²ω'],'Differentiate x = A cos ωt: v = dx/dt = −Aω sin ωt. The sine has maximum absolute value 1, so |v|max = Aω. This happens when the body passes the equilibrium position. Check the units: metres times rad/s gives m/s. Aω² would be an acceleration.'],
['f','Maximum acceleration in SHM:','a_max = Aω²',['a_max = Aω','a_max = A/ω²','a_max = A²ω'],'Differentiate the velocity: a = dv/dt = −Aω² cos ωt = −ω²x. The cosine has maximum absolute value 1, so |a|max = Aω². It is reached at the turning points, where |x| = A and the restoring force is largest. Units: m·(1/s²) = m/s².'],
['f','Period of a mass m on a spring of stiffness k:','T = 2π√(m/k)',['T = 2π√(k/m)','T = 2π·m/k','T = √(m/k)/2π'],'Newton second law for the spring force: m·x″ = −kx, so x″ + (k/m)x = 0. Comparing with x″ + ω₀²x = 0 gives ω₀² = k/m. Then T = 2π/ω₀ = 2π√(m/k). A heavier mass makes the period longer and a stiffer spring makes it shorter. The version with k/m inside the root has this backwards.'],
['f','Period of a simple pendulum of length l:','T = 2π√(l/g)',['T = 2π√(g/l)','T = 2π√(lg)','T = 2π·l/g'],'For small angles the tangential restoring force is mg·sin θ ≈ mgθ, and the displacement along the arc is x = lθ. This gives x″ + (g/l)x = 0, so ω₀ = √(g/l) and T = 2π√(l/g). The mass cancels out, so the period does not depend on it. A longer pendulum swings slower, and stronger gravity makes it faster.'],
['f','Total mechanical energy of a harmonic oscillator:','E = kA²/2',['E = kA','E = kA²','E = mA/2'],'At the turning point the speed is zero, so all the energy is stored in the spring: E = ½kA². In the absence of friction the total energy stays constant during the whole motion, and it is shared between kinetic and potential parts. Because E is proportional to A², doubling the amplitude makes the energy four times larger.'],
['f','Potential energy of a spring at displacement x:','U = kx²/2',['U = kx','U = kx²','U = mgx'],'The spring force is F = −kx. The work needed to stretch it from 0 to x is the integral of kx dx, which equals ½kx². That work is stored as potential energy U = kx²/2. The option kx is the force, not the energy, and mgx is gravitational potential energy, which has nothing to do with the spring.'],
['f','Speed of the oscillator at displacement x:','v = ±ω√(A² − x²)',['v = ±ω(A − x)','v = ±ωA²x','v = ±Aω/x'],'Energy conservation: ½mv² + ½kx² = ½kA². Solve for v: v² = (k/m)(A² − x²) = ω²(A² − x²), so v = ±ω√(A² − x²). Check the limits: at x = 0 we get v = Aω (maximum), at x = ±A we get v = 0 (turning point).'],
['f','Spring k = 200 N/m, mass m = 2 kg. Angular frequency ω₀ is:','10 rad/s',['100 rad/s','1 rad/s','20 rad/s'],'Use ω₀ = √(k/m) = √(200/2) = √100 = 10 rad/s. A common mistake is to forget the square root and answer 100. The units are rad/s because k/m has units of 1/s².'],
['f','Period T = 0.5 s. The frequency f is:','2 Hz',['0.5 Hz','4 Hz','π Hz'],'Frequency is the inverse of the period: f = 1/T = 1/0.5 s = 2 Hz. This means two full oscillations every second. The answer 0.5 Hz would come from mixing up T and f.'],
['f','Pendulum l = 1 m, g ≈ 9.8 m/s². The period is about:','2.0 s',['1.0 s','3.1 s','0.5 s'],'Use T = 2π√(l/g) = 2π·√(1/9.8) = 2π·0.319 ≈ 2.0 s. A pendulum of length 1 m is almost exactly the so called seconds pendulum, whose half period is about 1 s. The answer 1.0 s would come from forgetting the factor 2π.'],
['f','A = 0.1 m, ω = 20 rad/s. Maximum velocity:','2 m/s',['0.2 m/s','200 m/s','0.005 m/s'],'The maximum speed is v_max = Aω = 0.1 m × 20 rad/s = 2 m/s. The answer 0.2 m/s would come from multiplying by 2 instead of 20, and 200 m/s from mixing up the units of the amplitude.'],
['f','Damped oscillations: the amplitude follows:','A(t) = A₀e^(−βt)',['A(t) = A₀e^(βt)','A(t) = A₀ − βt','A(t) = A₀/βt'],'With friction proportional to velocity the amplitude decays exponentially: A(t) = A₀e^(−βt), where β is the damping coefficient. The energy is proportional to A², so it decays twice as fast, as e^(−2βt). The form with e^(+βt) would mean growing oscillations, which is physically impossible without an energy source.'],
['f','Relaxation time τ (amplitude drops by a factor e):','τ = 1/β',['τ = β','τ = 2π/β','τ = β²'],'Relaxation time is the time after which the amplitude falls by a factor e ≈ 2.718, to about 37% of the start. Put t = τ: A₀e^(−βτ) = A₀/e. This requires βτ = 1, so τ = 1/β. Strong damping (large β) means a short relaxation time.'],
['f','Logarithmic damping decrement:','λ = βT',['λ = β/T','λ = T/β','λ = βω'],'The logarithmic decrement is the natural log of the ratio of two amplitudes separated by one period: λ = ln(A(t)/A(t+T)). Since A(t)/A(t+T) = e^(βT), we get λ = βT. It measures how much the amplitude shrinks during one oscillation.'],
['f','Quality factor in terms of the decrement:','Q = π/λ',['Q = λ/π','Q = πλ','Q = 2λ'],'The quality factor shows how many oscillations the system makes before it loses its energy. The number of oscillations during the relaxation time is N = τ/T = 1/(βT) = 1/λ, and Q = πN = π/λ. Small damping means a small decrement and a large Q.'],
['f','Frequency of damped oscillations:','ω = √(ω₀² − β²)',['ω = ω₀ + β','ω = √(ω₀² + β²)','ω = ω₀β'],'Substituting x = A₀e^(−βt)·cos ωt into x″ + 2βx′ + ω₀²x = 0 gives ω² = ω₀² − β². So damping always lowers the frequency a little. If β ≥ ω₀ the motion is no longer oscillatory at all and the body just creeps back to equilibrium (aperiodic motion).'],
['f','Equation of a damped oscillator:','x″ + 2βx′ + ω₀²x = 0',['x″ + ω₀²x = 0','x″ − 2βx′ + ω₀²x = 0','x′ + ω₀x = 0'],'The forces are the spring force −kx and the friction force −rv. Newton second law gives m·x″ = −kx − rv. Divide by m and put 2β = r/m and ω₀² = k/m: x″ + 2βx′ + ω₀²x = 0. The form with −2βx′ would describe negative damping, where oscillations grow.'],
['f','Equation of a harmonic oscillator:','x″ + ω₀²x = 0',['x″ − ω₀²x = 0','x′ + ω₀²x = 0','x″ + ω₀x′ = 0'],'From m·x″ = −kx we get x″ + (k/m)x = 0, that is x″ + ω₀²x = 0. Its solutions are sines and cosines. With a minus sign (x″ − ω₀²x = 0) the solutions are exponentials, so there would be no oscillations. The equations with first derivative terms describe damping, not free oscillations.'],
['f','The mass on a spring is increased 4 times. The period:','doubles',['quadruples','halves','does not change'],'The period is T = 2π√(m/k), so T is proportional to √m. If the mass grows 4 times, the period grows √4 = 2 times. So the period doubles, not quadruples. The square root is the usual trap here.'],
['t','What defines harmonic oscillations?','Force proportional to displacement and opposite to it',['Constant force','Force proportional to velocity','Force proportional to displacement squared'],'A motion is harmonic when the restoring force is proportional to the displacement and points opposite to it: F = −kx. This leads to the equation x″ + ω²x = 0. A constant force gives uniform acceleration, a force proportional to velocity is friction, and a force proportional to x² gives anharmonic (non harmonic) oscillations.'],
['t','How does the quantity change in harmonic oscillations?','As a sine or cosine of time',['Linearly','Exponentially','Parabolically'],'Harmonic oscillations are described by a sine or cosine of time, for example x = A cos(ωt + φ). Sine and cosine are the same function shifted by a quarter period. Linear, exponential or parabolic changes are not periodic, so they cannot describe oscillations.'],
['t','What is the phase of an oscillation?','The argument (ωt + φ)',['The amplitude','The period','The frequency'],'The phase is the whole argument of the cosine, (ωt + φ). It tells the exact state of the oscillator at time t: where the body is and in which direction it moves. Amplitude, period and frequency are parameters of the motion, they do not describe its state at a given moment.'],
['t','What is the initial phase?','The phase at t = 0',['The phase after one period','The maximum displacement','The frequency at t = 0'],'The initial phase φ is the value of the phase at t = 0. It is not chosen freely, it is set by the initial conditions, the starting position x₀ and starting velocity v₀. For example, starting from maximum displacement gives φ = 0, and starting from equilibrium moving forward gives φ = −π/2.'],
['t','Where is the speed maximum?','At the equilibrium position',['At the turning points','Everywhere equal','Only at the start'],'The total energy is constant. At the equilibrium position x = 0 the potential energy is zero, so all the energy is kinetic and the speed is maximum: v_max = Aω. At the turning points the body stops for a moment, so the speed is zero there. That is why the speed is not the same everywhere.'],
['t','Where is the acceleration maximum in magnitude?','At the turning points',['At equilibrium','Halfway between','It is constant'],'The acceleration is a = −ω²x, so its magnitude is largest where |x| is largest, at the turning points. There the restoring force is maximum, and the body changes the direction of motion. At equilibrium the force is zero, so the acceleration there is zero.'],
['t','Phase of velocity relative to displacement:','Velocity leads by π/2',['Same phase','Opposite phase (π)','Velocity lags by π/2'],'If x = A cos(ωt + φ), then v = −Aω sin(ωt + φ) = Aω cos(ωt + φ + π/2). The velocity phase is larger by π/2, so velocity leads the displacement by a quarter period. For example, the speed is already maximum when the body passes equilibrium, before it reaches the extreme position.'],
['t','Phase of acceleration relative to displacement:','Opposite phase (shift π)',['Same phase','Shift π/2','Shift π/4'],'Since a = −ω²x, the acceleration is always opposite to the displacement. When x is at maximum, a is at its negative maximum. This is a phase shift of π (half a period), the two curves are mirror images of each other.'],
['t','Energy at the equilibrium position:','All kinetic',['All potential','Half and half','Zero'],'At equilibrium x = 0, so the spring potential energy ½kx² is zero. The total energy is constant, so all of it is kinetic: E = ½mv_max². This is why the speed is largest at this point.'],
['t','Energy at the turning points:','All potential',['All kinetic','Half and half','Zero'],'At the turning points the body momentarily stops, v = 0, so the kinetic energy is zero. The total energy is then purely potential: E = ½kA². Then the body moves back, and potential energy turns into kinetic energy again.'],
['t','Total energy is proportional to:','The square of the amplitude',['The amplitude','The period','The square root of the amplitude'],'The total energy is E = ½kA², so it is proportional to the square of the amplitude. If the amplitude doubles, the energy grows four times. It is not proportional to A itself, and it does not depend on the period for a given k and A.'],
['t','Does the period of SHM depend on the amplitude?','No',['Yes, it grows','Yes, it shrinks','Only on the phase'],'For a harmonic oscillator T = 2π√(m/k) contains only m and k, there is no amplitude in it. This property is called isochronism. A bigger amplitude means a longer path, but also proportionally larger speeds, so the time of one oscillation stays the same. (For a pendulum this holds only for small angles.)'],
['t','Lissajous: equal frequencies and identical phases give:','A straight line',['A circle','A figure eight','A spiral'],'If both motions have the same frequency and the same phase, x = A cos ωt and y = B cos ωt, then y = (B/A)·x. This is the equation of a straight line through the origin. Different phases would open the line into an ellipse.'],
['t','Lissajous: equal amplitudes, phase difference π/2 give:','A circle',['A straight line','A parabola','A figure eight'],'Take x = A cos ωt and y = A cos(ωt − π/2) = A sin ωt. Then x² + y² = A²(cos² + sin²) = A², which is a circle of radius A. If the amplitudes were different, the same phase shift would give an ellipse instead.'],
['t','What determines a Lissajous figure?','Frequency ratio, amplitudes and phases',['Only amplitudes','Only phases','Only frequencies'],'The shape of a Lissajous figure depends on three things: the ratio of the frequencies, the ratio of the amplitudes and the phase difference. For example, a 1:1 frequency ratio gives a line, an ellipse or a circle, and a 1:2 ratio gives a figure eight. Knowing only one of these is not enough to say the shape.'],
['t','What is the relaxation time τ?','Time for the amplitude to drop by a factor e',['Time of one oscillation','Time to stop completely','Time for the amplitude to halve'],'The relaxation time τ is the time in which the amplitude of damped oscillations decreases e times (e ≈ 2.718), which gives τ = 1/β. It is not the period, and it is not the time to stop completely, because exponential decay never reaches exactly zero. The time to halve the amplitude is shorter: ln 2/β ≈ 0.69τ.'],
['t','When does resonance occur in forced oscillations?','Driving frequency close to the natural frequency',['The force is very large','There is no damping','Driving frequency far above natural'],'In forced oscillations the amplitude is largest when the driving frequency is close to the natural frequency of the system. Then the force pushes the body in phase with its velocity and pumps in the maximum energy each cycle. A very large force alone does not cause resonance, and far from the natural frequency the response is small.'],
['t','How does Q affect the resonance peak?','Higher Q: narrower and taller peak',['Higher Q: wider peak','No effect','Higher Q: no peak'],'A high Q means weak damping. Then the resonance curve becomes narrow (its width is about ω₀/Q) and tall (the amplitude at resonance grows in proportion to Q). This is how a radio receiver can pick one station out of many close ones. A low Q gives a broad, low peak.']
/*Q1_END*/]},
{id:2,t:"Waves",qs:[
['f','A harmonic wave travelling in the +x direction is described by:','y = A cos(kx − ωt)',['y = A cos(kx + ωt)','y = A cos(kx)·ωt','y = A cos(ωt/k)'],'A point of constant phase satisfies kx − ωt = const, so x = ωt/k + const grows with time: the pattern moves toward +x. The sign +ωt gives x = −ωt/k + const, which is a wave going to −x. The other two forms are not travelling waves, because x and t do not enter as one phase.'],
['f','Wave number k in terms of wavelength λ:','k = 2π/λ',['k = λ/2π','k = 2πλ','k = 1/λ'],'Over one wavelength the spatial phase kx grows by exactly 2π, so kλ = 2π and k = 2π/λ. It is the spatial analogue of ω = 2π/T. Units: rad/m. The form 1/λ lacks the factor 2π and is only a spectroscopic “wavenumber”.'],
['f','Relation between wave speed v, wavelength λ and frequency f:','v = λf',['v = λ/f','v = f/λ','v = λT'],'In one period T the wave moves forward by one wavelength, so v = λ/T = λf. Check units: m · 1/s = m/s. The forms λ/f and λT give m·s, which is not a speed.'],
['f','Phase speed of a harmonic wave in terms of ω and k:','v = ω/k',['v = k/ω','v = ωk','v = ω²/k'],'From v = λf with λ = 2π/k and f = ω/2π we get v = (2π/k)(ω/2π) = ω/k. It is also the speed at which the point kx − ωt = const moves. Units: (rad/s)/(rad/m) = m/s.'],
['f','Speed of a transverse wave on a string with tension F and linear mass density μ:','v = √(F/μ)',['v = √(μ/F)','v = F/μ','v = √(Fμ)'],'A larger tension restores the string faster, so v grows with F. A heavier string (larger μ) reacts more slowly, so v falls with μ. Only √(F/μ) satisfies both. Units: N/(kg/m) = m²/s², so the root is m/s.'],
['f','A sound wave has f = 500 Hz and λ = 0.68 m. Its speed is:','340 m/s',['735 m/s','34 m/s','0.0014 m/s'],'v = λf = 0.68 × 500 = 340 m/s, close to the speed of sound in air. The value 735 comes from f/λ, and 0.0014 comes from λ/f; both are wrong operations.'],
['f','A wave is y = 0.02 cos(5x − 200t) in SI units. Its speed is:','40 m/s',['1000 m/s','0.025 m/s','195 m/s'],'Compare with y = A cos(kx − ωt): k = 5 rad/m and ω = 200 rad/s. Then v = ω/k = 200/5 = 40 m/s. Multiplying (1000) or subtracting (195) the numbers has no physical meaning.'],
['f','For the wave y = 0.02 cos(5x − 200t) (SI) the wavelength is about:','1.26 m',['5.0 m','0.80 m','31.4 m'],'k = 2π/λ, so λ = 2π/k = 6.283/5 ≈ 1.26 m. The value 0.80 m is k/2π, which is the inverted formula, and 31.4 m is 2π·k. Do not confuse k itself (5 rad/m) with a length.'],
['f','A string has F = 100 N and μ = 0.04 kg/m. The wave speed is:','50 m/s',['2 m/s','2500 m/s','25 m/s'],'v = √(F/μ) = √(100/0.04) = √2500 = 50 m/s. The value 2500 is the quantity before the root was taken, 2 m/s comes from √(Fμ), and 25 m/s is half the answer.'],
['f','The tension in a string is increased 4 times. The wave speed:','doubles',['quadruples','halves','does not change'],'v ∝ √F. If F → 4F, then v → √4 · v = 2v. The speed does not depend on the amplitude or the frequency of the wave, only on the medium: tension and μ.'],
['f','Speed of electromagnetic waves in vacuum in terms of ε₀ and μ₀:','c = 1/√(ε₀μ₀)',['c = √(ε₀μ₀)','c = ε₀μ₀','c = √(ε₀/μ₀)'],'Combining Faraday’s law and the Ampère–Maxwell law in empty space gives a wave equation whose speed is 1/√(ε₀μ₀) = 1/√(8.85·10⁻¹² · 4π·10⁻⁷) ≈ 3·10⁸ m/s. This was Maxwell’s proof that light is an electromagnetic wave.'],
['f','The relation between the amplitudes of E and B in a plane EM wave in vacuum:','E = cB',['E = B/c','E = c²B','E = B'],'Faraday’s law links the two fields, and for a wave moving at speed c this gives E₀ = cB₀. Units: (m/s)·T = V/m, which is correct, because 1 T = V·s/m². E = B has different units.'],
['f','An EM wave has E₀ = 300 V/m. The amplitude of B is:','1×10⁻⁶ T',['1×10⁻⁸ T','9×10¹⁰ T','3×10⁻⁶ T'],'B₀ = E₀/c = 300/(3·10⁸) = 1·10⁻⁶ T. Magnetic fields of light are tiny in tesla. 9·10¹⁰ comes from multiplying E₀ by c, which is the inverted relation.'],
['f','Magnitude of the Poynting vector (energy flux) of an EM wave:','S = EB/μ₀',['S = μ₀EB','S = EB/ε₀','S = E/(μ₀B)'],'The Poynting vector is S = (1/μ₀) E × B. For perpendicular E and B its magnitude is EB/μ₀. Units: V/m · T / (T·m/A) = W/m², an energy flux. It points along the direction of wave propagation.'],
['f','An FM radio wave has f = 100 MHz. Its wavelength in vacuum is:','3 m',['0.33 m','30 m','3×10¹⁶ m'],'λ = c/f = 3·10⁸ / 10⁸ = 3 m. The value 0.33 m is f/c, and 3·10¹⁶ is c·f, so both come from the wrong operation.'],
['f','Natural frequencies of a string of length L fixed at both ends:','f = n v/(2L), n = 1, 2, 3…',['f = n v/L','f = v/(2nL)','f = n v/(4L)'],'Both ends are nodes, so an integer number of half-wavelengths fits on the string: L = nλ/2, λ = 2L/n. Then f = v/λ = nv/(2L). The formula nv/4L belongs to a tube or string with one fixed and one free end.'],
['f','A string of length 0.6 m with wave speed 240 m/s, fixed at both ends. The fundamental frequency is:','200 Hz',['400 Hz','100 Hz','800 Hz'],'f₁ = v/(2L) = 240/(2·0.6) = 200 Hz. The value 400 Hz would ignore the factor 2, because the fundamental has λ = 2L, not L. 100 Hz would come from the wrong factor 4L.'],
['f','In a standing wave, the distance between two adjacent nodes is:','λ/2',['λ','λ/4','2λ'],'Nodes are zeros of cos kx, which occur where kx = π/2 + mπ. Neighbouring zeros differ by Δx = π/k = λ/2. The distance between a node and the next antinode is λ/4.'],
['f','Superposition of y₁ = A cos(kx − ωt) and y₂ = A cos(kx + ωt) gives:','y = 2A cos kx · cos ωt',['y = 2A cos(kx − ωt)','y = 2A sin(kx − ωt)','y = A cos 2kx · cos 2ωt'],'Use cos a + cos b = 2 cos((a+b)/2) cos((a−b)/2). Here (a+b)/2 = kx and (a−b)/2 = −ωt, so y = 2A cos kx cos ωt. The positions of the nodes (cos kx = 0) are fixed, so the wave stands in place and does not travel.'],
['f','The amplitude of a wave is doubled. Its intensity (energy flux) changes by a factor of:','4',['2','8','16'],'Energy of a wave is proportional to the square of the amplitude, so I ∝ A². Doubling A gives (2)² = 4 times the intensity. The same is true for EM waves, where S ∝ E₀².'],
['t','In a transverse wave the particles of the medium move:','perpendicular to the direction of propagation',['along the direction of propagation','in the direction of the wave only once','in circles around the source only'],'Transverse means that the displacement is perpendicular to the direction in which the energy travels, as on a string. In a longitudinal wave the particles move along that direction. Particles never travel along with the wave; they only oscillate around equilibrium.'],
['t','Which of these waves is longitudinal?','Sound in air',['Waves on a stretched string','Light in vacuum','Radio waves'],'In sound, air particles oscillate back and forth along the direction of propagation, forming compressions and rarefactions. A string wave is transverse, and light and radio are electromagnetic waves whose fields are transverse.'],
['t','What does a travelling wave transfer?','Energy and momentum, without transfer of matter',['Matter without energy','Only the medium itself','Only the phase but no energy'],'Particles of the medium only oscillate near their equilibrium positions. What moves forward is the disturbance, carrying energy and momentum. A cork on a water wave bobs up and down and does not travel with the wave.'],
['t','The speed of a wave on a string depends on:','tension and linear mass density only',['amplitude and frequency','amplitude only','the wavelength only'],'v = √(F/μ) is a property of the medium. Changing the frequency changes λ so that λf stays equal to v. Changing the amplitude does not change the speed (for small waves).'],
['t','A pulse reaches a fixed end of a string. The reflected pulse is:','inverted (phase shift π)',['not inverted','absorbed completely','of double speed'],'The pulse pulls the support up, and the support, by Newton’s third law, pulls the string down. This reaction force creates a pulse of opposite sign. The displacement at the fixed end must always stay zero, which is only possible if the reflected wave cancels the incoming one there.'],
['t','A pulse reaches a free end of a string (a ring on a frictionless rod). The reflected pulse is:','not inverted',['inverted','twice as slow','absorbed by the ring'],'At a free end the string can move, so the displacement is maximal there and the reflected wave adds to the incoming wave with the same sign. There is no phase shift. Compare with the fixed end, where a phase shift of π occurs.'],
['t','A wave passes from one medium into another. Which quantity stays the same?','frequency',['wavelength','speed','wave number'],'The source sets the frequency, and the boundary cannot create or destroy cycles, so f is the same on both sides. The speed depends on the medium, and since v = λf, the wavelength changes in proportion to v. The wave number k = 2π/λ also changes.'],
['t','What does the superposition principle state?','The resulting displacement is the sum of the displacements of the individual waves',['Waves always cancel each other','Waves always change their speed','The larger wave absorbs the smaller one'],'For linear media, each wave travels as if the other were absent, and at every point the total displacement is y = y₁ + y₂. After crossing, the waves continue unchanged. This is the basis of interference and standing waves.'],
['t','When does destructive interference occur?','When the waves meet with a phase difference of π (in antiphase)',['When they meet in phase','When they have different speeds','When their frequencies are exactly equal and the phase is 0'],'If one wave has a crest where the other has a trough, their sum is reduced, and for equal amplitudes it is zero. For phase differences of 0, 2π, … the waves add up to a maximum, which is constructive interference.'],
['t','What is a node of a standing wave?','A point where the amplitude is always zero',['A point of maximum amplitude','A point where the speed is c','A point where the phase is zero'],'In y = 2A cos kx cos ωt, nodes are the points where cos kx = 0, so they never move. Points with |cos kx| = 1 are antinodes with the maximum amplitude 2A.'],
['t','Does a standing wave transfer net energy along the string?','No, the two travelling waves carry equal energy in opposite directions',['Yes, always to the right','Yes, along the nodes','Yes, it carries energy at speed v'],'A standing wave is the sum of two identical waves moving in opposite directions, so the energy flows cancel on average. Energy only moves between kinetic and potential forms within the loops between nodes.'],
['t','Gauss’s law for the electric field says that the electric flux through a closed surface equals:','the enclosed charge divided by ε₀',['zero always','the enclosed current times μ₀','the rate of change of the magnetic flux'],'∮E·dA = q/ε₀. It relates the electric field to the charges that create it. The flux is zero only when the net enclosed charge is zero. The other two options belong to Ampère’s and Faraday’s laws.'],
['t','Gauss’s law for magnetism states that the net magnetic flux through a closed surface is zero. This means:','magnetic monopoles do not exist and field lines have no start or end',['the magnetic field is always zero','magnetic charges exist but are neutral','magnetic field lines never form loops'],'Every field line that enters a closed volume must leave it, so there is no point where field lines begin or end (no isolated north or south pole). Field lines of B form closed loops, which is the opposite of the last option.'],
['t','Faraday’s law of induction says:','a changing magnetic flux creates an electric field (an emf)',['a static charge creates a magnetic field','a constant current creates an electric flux','electric charge is conserved only in vacuum'],'The emf around a closed path equals −dΦ_B/dt. A time-varying B therefore produces a circulating E. This is one half of the mechanism of EM waves: changing B creates E.'],
['t','What did Maxwell add to Ampère’s law?','A term with the changing electric flux, which creates a magnetic field',['A term with the magnetic charge','A term with the speed of sound','A term that cancels all currents'],'Ampère–Maxwell law: ∮B·dl = μ₀I + μ₀ε₀ dΦ_E/dt. The second term (displacement current) means that a changing E also creates B. Together with Faraday’s law, it lets E and B sustain each other as a wave.'],
['t','In an EM wave in vacuum, the vectors E and B are:','perpendicular to each other and to the direction of propagation',['parallel to the direction of propagation','parallel to each other','perpendicular only to E'],'EM waves are transverse: E ⟂ B, and both are perpendicular to the propagation direction, which is that of E × B. There is no field component along the direction of travel.'],
['t','In a plane EM wave in vacuum, E and B oscillate:','in phase',['with a phase shift of π/2','in antiphase','at different frequencies'],'Because E = cB at every point and time, both reach maxima and zeros together. Unlike an AC circuit with a coil or capacitor, there is no phase shift between the fields of the wave.'],
['t','Do EM waves need a material medium to propagate?','No, they propagate in vacuum',['Yes, they need air','Yes, they need a special “ether”','Only if their frequency is high'],'The fields sustain each other (changing B creates E and changing E creates B), so no medium is required. This is why light from the Sun reaches the Earth. The ether hypothesis was rejected by experiment.'],
['t','Which Maxwell equations are combined to derive the EM wave equation in empty space (I = 0, q = 0)?','Faraday’s law and the Ampère–Maxwell law',['Only the two Gauss laws','Only Gauss’s law for E','Gauss’s law for B and Gauss’s law for E'],'Taking the curl of Faraday’s law and inserting the Ampère–Maxwell law (with I = 0) gives a wave equation for E, with speed 1/√(ε₀μ₀). The Gauss laws give constraints, such as the transversality of the waves.'],
['t','The energy flow in an EM wave is directed:','along E × B, that is, along the direction of propagation',['along E','along B','opposite to the direction of propagation'],'The Poynting vector S = E × B/μ₀ gives the direction and the magnitude of the energy flux. For a plane wave it points the same way the wave travels, so the wave carries energy away from its source.']
/*Q2_END*/]},
{id:3,t:"Alternating current (AC)",qs:[
['f','Relation between the amplitude and the rms value of a sinusoidal current:','I_rms = I₀/√2',['I_rms = I₀/2','I_rms = I₀√2','I_rms = I₀/π'],'The rms value is the square root of the mean of i². For i = I₀ sin ωt the mean of sin² is 1/2, so I_rms = I₀/√2 ≈ 0.707 I₀. The factor 1/2 would be the average of i², not its root, and √2 would make the rms larger than the amplitude, which is impossible.'],
['f','The mains voltage has amplitude V₀ = 311 V. Its rms value is about:','220 V',['155 V','440 V','99 V'],'V_rms = V₀/√2 = 311/1.414 ≈ 220 V, the usual household voltage. 155 V is V₀/2, 440 V is 2·V_rms, and 99 V is V₀/π; none of them is the rms value.'],
['f','Inductive reactance of a coil of inductance L at angular frequency ω:','X_L = ωL',['X_L = 1/(ωL)','X_L = L/ω','X_L = ω²L'],'The emf of self-induction is −L di/dt. For i = I₀ sin ωt this gives a voltage amplitude V₀ = ωL·I₀, so X_L = ωL. It grows with frequency, because faster changes of current are opposed more. Units: rad/s · H = Ω.'],
['f','Capacitive reactance of a capacitor C at angular frequency ω:','X_C = 1/(ωC)',['X_C = ωC','X_C = C/ω','X_C = 1/(ω²C)'],'The current is i = C dv/dt, so for v = V₀ sin ωt its amplitude is I₀ = ωC·V₀, and X_C = V₀/I₀ = 1/(ωC). It falls with frequency, and at ω → 0 (DC) it is infinite: the capacitor blocks DC.'],
['f','A coil with L = 0.1 H at f = 50 Hz has a reactance of about:','31.4 Ω',['5 Ω','314 Ω','0.032 Ω'],'ω = 2πf = 314 rad/s, so X_L = ωL = 314 × 0.1 = 31.4 Ω. The value 5 Ω comes from f·L, forgetting the 2π, and 314 Ω would belong to L = 1 H.'],
['f','A capacitor C = 100 μF at f = 50 Hz has a reactance of about:','31.8 Ω',['0.031 Ω','318 Ω','3.14 Ω'],'X_C = 1/(ωC) = 1/(314 × 10⁻⁴) ≈ 31.8 Ω. Be careful with the prefix: 100 μF = 10⁻⁴ F. Using 10⁻⁶ would give 3180 Ω and using ωC instead gives 0.031 Ω, so check the units.'],
['f','Impedance of a series RLC circuit:','Z = √(R² + (X_L − X_C)²)',['Z = R + X_L + X_C','Z = √(R² + X_L² + X_C²)','Z = √(R² + (X_L + X_C)²)'],'The voltages on L and C are in antiphase (+90° and −90° relative to the current), so their reactances subtract: X = X_L − X_C. The resistor voltage is at 90° to that, so the result adds in quadrature. Simple summation would ignore the phases.'],
['f','R = 30 Ω, X_L = 80 Ω, X_C = 40 Ω in series. The impedance is:','50 Ω',['150 Ω','70 Ω','124 Ω'],'X = X_L − X_C = 40 Ω. Then Z = √(30² + 40²) = √2500 = 50 Ω, a 3-4-5 triangle. The sum 150 Ω ignores the phases, and 124 Ω wrongly adds the reactances (120 Ω).'],
['f','The phase angle φ between voltage and current in a series RLC circuit:','tan φ = (X_L − X_C)/R',['tan φ = R/(X_L − X_C)','tan φ = (X_L + X_C)/R','tan φ = X_L/X_C'],'On the phasor diagram the net reactance X_L − X_C is the vertical leg and R the horizontal leg of the impedance triangle, so tan φ = (X_L − X_C)/R. The result is positive for an inductive circuit and negative for a capacitive one.'],
['f','Resonant angular frequency of a series LC circuit:','ω₀ = 1/√(LC)',['ω₀ = √(LC)','ω₀ = 1/(LC)','ω₀ = √(L/C)'],'Resonance means X_L = X_C, so ω₀L = 1/(ω₀C). Then ω₀² = 1/(LC) and ω₀ = 1/√(LC). Check the units: the product LC is in s², so its inverse root is in 1/s.'],
['f','L = 1 mH and C = 1 μF. The resonant angular frequency is about:','3.2×10⁴ rad/s',['1×10⁶ rad/s','3.2×10⁻⁵ rad/s','1000 rad/s'],'LC = 10⁻³ × 10⁻⁶ = 10⁻⁹ s². So ω₀ = 1/√(10⁻⁹) = 1/(3.16·10⁻⁵) ≈ 3.2·10⁴ rad/s. The value 3.2·10⁻⁵ is √(LC), the inverted answer, which is the period-like quantity, not a frequency.'],
['f','Average power in an AC circuit with rms values V and I and phase angle φ:','P = V_rms I_rms cos φ',['P = V_rms I_rms sin φ','P = V₀ I₀ cos φ','P = V_rms I_rms'],'The instantaneous power is v·i, and its average over a period is ½V₀I₀ cos φ = V_rms I_rms cos φ. Only the component of the current in phase with the voltage does work. With sin φ the answer would be zero for a pure resistor, which is wrong.'],
['f','V_rms = 220 V, I_rms = 5 A and φ = 60°. The average power is:','550 W',['1100 W','953 W','1650 W'],'P = 220 × 5 × cos 60° = 1100 × 0.5 = 550 W. The value 1100 W is the apparent power (cos φ ignored), and 953 W comes from the wrong function sin 60° ≈ 0.866.'],
['f','The power factor of a series RLC circuit equals:','cos φ = R/Z',['Z/R','X/Z','R/X'],'From the impedance triangle, the adjacent leg is R and the hypotenuse is Z, so cos φ = R/Z. It is always between 0 and 1. A low power factor means large current for the same useful power, which increases losses in wires.'],
['f','Quality factor of a series RLC circuit at resonance:','Q = ω₀L/R',['Q = R/(ω₀L)','Q = ω₀R/L','Q = L/(ω₀R)'],'Q compares the reactive voltage on the coil with the voltage on the resistor: V_L/V_R = ω₀L·I/(R·I) = ω₀L/R. Less resistance means higher Q and a sharper resonance. The inverted form would grow with R, which is the wrong trend.'],
['f','Voltage ratio of an ideal transformer with N₁ primary and N₂ secondary turns:','V₂/V₁ = N₂/N₁',['V₂/V₁ = N₁/N₂','V₂/V₁ = N₁N₂','V₂/V₁ = (N₂/N₁)²'],'The same magnetic flux passes through both coils, so the emf per turn is equal in both: V₁/N₁ = V₂/N₂. More turns on the secondary means a higher voltage (step-up transformer).'],
['f','A transformer with N₁ = 100, N₂ = 500 gets V₁ = 20 V. The secondary voltage is:','100 V',['4 V','500 V','25 V'],'V₂ = V₁·N₂/N₁ = 20 × 5 = 100 V. The value 4 V is V₁·N₁/N₂ (inverted ratio). Notice that the transformer is step-up, so the secondary voltage must exceed 20 V.'],
['f','For the same transformer (N₁ = 100, N₂ = 500) the primary current is 10 A. The secondary current is:','2 A',['50 A','10 A','0.4 A'],'For an ideal transformer, power is conserved: V₁I₁ = V₂I₂, so I₂ = I₁N₁/N₂ = 10/5 = 2 A. A higher voltage always comes with a lower current. Getting 50 A would create energy from nothing.'],
['f','At resonance of a series RLC circuit, the impedance is:','Z = R (its minimum value)',['Z = X_L + X_C','Z = 0','Z → ∞'],'At resonance X_L = X_C, so the reactances cancel and Z = √(R² + 0) = R, which is the smallest possible value. Then the current I = V/R is maximal. Z = 0 would only be possible if R = 0 as well.'],
['t','In a circuit with only a resistor, the current and the voltage are:','in phase',['shifted by π/2','in antiphase','shifted by π/4'],'Ohm’s law holds at every moment, i = v/R, so both reach maxima and zeros together. The phase shift φ = 0 and the power factor is 1. Shifts appear only with coils and capacitors.'],
['t','In an ideal inductor, the voltage:','leads the current by π/2',['lags the current by π/2','is in phase with the current','is in antiphase to the current'],'v = L di/dt. For i = I₀ sin ωt the derivative is cos ωt, which reaches its maximum a quarter-period earlier than the current. A memory aid: “ELI the ICE man” — in L, voltage E leads I.'],
['t','In an ideal capacitor, the current:','leads the voltage by π/2',['lags the voltage by π/2','is in phase with the voltage','is in antiphase to the voltage'],'i = C dv/dt, so for a sinusoidal voltage the current is a cosine and reaches its maximum a quarter-period before the voltage. In “ICE”, in C the current I leads the voltage E.'],
['t','The rms value of an alternating current is:','the DC value that gives the same average heating power in a resistor',['the average over a whole period','half of the amplitude','the value at the moment t = 0'],'The plain average of a sinusoid over a period is zero, so it is not useful. The rms value is chosen so that I_rms²R equals the mean power of the AC current. This is why a 220 V rms supply heats like a 220 V DC one.'],
['t','What is the average power consumed by an ideal inductor or capacitor over a full period?','zero',['maximal','equal to V_rms·I_rms','equal to ½LI₀²'],'Energy flows into the coil or capacitor during one quarter of the period and returns to the source in the next quarter, because the phase shift is π/2 and cos φ = 0. No energy is dissipated. Only resistance converts energy to heat.'],
['t','What do ordinary AC voltmeters and ammeters show?','rms values',['amplitude values','instantaneous values','average values over a period'],'They are calibrated to read rms values, because those are directly related to power. So “220 V” in a socket means V_rms, while the amplitude is about 311 V.'],
['t','Why is the voltage raised for the transmission of electric power over long distances?','To reduce the current and so the I²R losses in the wires',['To reduce the frequency','To increase the resistance of the wires','To make the current in the wires larger'],'The same power P = VI is delivered with a smaller current if V is larger, and the heat loss in the line is I²R. Doubling V halves I and cuts the losses four times. Transformers make this possible for AC.'],
['t','Why does a transformer work only with alternating current?','It needs a changing magnetic flux to induce an emf in the secondary coil',['DC has too low a voltage','DC has no magnetic field','The core absorbs DC'],'By Faraday’s law the emf is −N dΦ/dt. With DC the flux is constant, so dΦ/dt = 0 and the secondary voltage is zero. A DC current does create a magnetic field, but it does not change.'],
['t','What is the condition of resonance in a series RLC circuit?','X_L = X_C',['X_L = R','X_C = R','X_L + X_C = 0'],'When the reactances are equal, they cancel (the voltages on L and C are in antiphase). The circuit then behaves as a pure resistor, and the current has its maximal value. The resonant frequency follows from ω₀L = 1/(ω₀C).'],
['t','At resonance in a series RLC circuit, the phase difference between voltage and current is:','zero',['π/2','π','π/4'],'tan φ = (X_L − X_C)/R = 0, so φ = 0. The current is in phase with the source voltage, the power factor equals 1 and the power is maximal.'],
['t','A series RLC circuit is driven at a frequency below its resonance frequency. It behaves like:','a capacitive circuit (the current leads the voltage)',['an inductive circuit','a pure resistor','a short circuit'],'At low ω, X_C = 1/(ωC) is large and X_L = ωL is small, so X_C > X_L. The net reactance is capacitive and φ < 0: the current leads the voltage.'],
['t','A series RLC circuit is driven at a frequency above its resonance frequency. It behaves like:','an inductive circuit (the voltage leads the current)',['a capacitive circuit','a pure resistor','an open circuit'],'At high ω, X_L = ωL becomes larger than X_C, so the net reactance is inductive and φ > 0. The voltage leads the current. Together with the previous case it shows how the phase changes sign at resonance.'],
['t','If the resistance R of a series RLC circuit is increased, the resonance peak of the current:','becomes lower and broader',['becomes higher and narrower','moves to a much higher frequency','does not change'],'At resonance I = V/R, so a larger R lowers the peak. Q = ω₀L/R drops, and the curve becomes wider. The resonant frequency 1/√(LC) does not depend on R (for weak damping).'],
['t','What does a high quality factor Q mean?','A narrow, sharp resonance peak and weak damping',['A broad peak and strong damping','A high resonant frequency only','A large resistance in the circuit'],'Q = ω₀L/R = ω₀/Δω, where Δω is the width of the peak. A high Q means that the circuit selects a very narrow range of frequencies, which is important for radio tuning.'],
['t','How does a coil behave toward DC and toward high-frequency AC?','It passes DC easily and strongly opposes high frequencies',['It blocks DC and passes high frequencies','It passes both equally','It blocks both completely'],'X_L = ωL is zero for DC (ω = 0) and grows with frequency. This is why coils are used as chokes to block high-frequency noise. A capacitor does the opposite.'],
['t','How does a capacitor behave toward DC and toward high-frequency AC?','It blocks DC and passes high frequencies easily',['It passes DC and blocks high frequencies','It passes both equally','It blocks both completely'],'X_C = 1/(ωC) is infinite for DC and small at large ω. That is why capacitors are used to separate the AC signal from a DC level, for example in audio circuits.'],
['t','What is a phasor in the analysis of AC circuits?','A rotating vector whose projection gives the instantaneous value',['A vector in real space showing the direction of the current','A constant vector with the rms value','A vector that points along the wire'],'A quantity such as v = V₀ sin(ωt + φ) is represented by a vector of length V₀ rotating with angular speed ω. Its vertical projection is the instantaneous value, and the angle between two phasors is the phase shift between the quantities.'],
['t','In which unit are reactance and impedance measured?','ohm (Ω)',['henry (H)','farad (F)','siemens (S)'],'Both are voltage divided by current, like resistance. Henry and farad are units of L and C, and siemens (1/Ω) measures conductance, which is the inverse quantity.'],
['t','What is the power factor of a circuit containing only a resistor?','1',['0','0.5','∞'],'The phase angle is φ = 0, so cos φ = 1: the whole of V_rms·I_rms is consumed. A power factor cannot exceed 1, and it is 0 for pure L or C, because they consume no average power.'],
['t','What does the self-induction in a coil do to a changing current?','It creates an emf that opposes the change of the current (Lenz’s law)',['It speeds up every change of the current','It makes the current constant','It converts the current into a charge'],'The emf is ε = −L di/dt. The minus sign (Lenz’s law) means that it resists any growth or decay of the current, which makes the current lag the voltage and gives the reactance X_L = ωL.'],
['f','A series circuit with R = 30 Ω, X_L = 80 Ω and X_C = 40 Ω is connected to V_rms = 100 V. The rms current is:','2 A',['3.3 A','1 A','0.8 A'],'Z = √(30² + (80 − 40)²) = 50 Ω, so I_rms = V_rms/Z = 100/50 = 2 A. The value 3.3 A would come from dividing by R only (100/30), which ignores the reactance. Ohm’s law for AC uses the impedance Z, not R.']
/*Q3_END*/]},
{id:4,t:"Geometric optics",qs:[
['f','Law of reflection:','angle of incidence = angle of reflection',['angle of incidence = 2 × angle of reflection','sin θᵢ = 2 sin θᵣ','angle of reflection = 90° − angle of incidence'],'Both angles are measured from the normal and are always equal.'],
['f','Snell’s law of refraction:','n₁ sin θ₁ = n₂ sin θ₂',['n₁ cos θ₁ = n₂ cos θ₂','n₁ θ₁ = n₂ θ₂','n₁ sin θ₂ = n₂ sin θ₁'],'The product n·sin θ is the same on both sides of the boundary.'],
['f','Refractive index in terms of the speed of light in the medium v:','n = c/v',['n = v/c','n = cv','n = c/v²'],'Light is slower in matter, so v < c and n > 1.'],
['f','Glass has n = 1.5. The speed of light in it is:','2×10⁸ m/s',['4.5×10⁸ m/s','1.5×10⁸ m/s','3×10⁸ m/s'],'v = c/n = 3·10⁸/1.5 = 2·10⁸ m/s.'],
['f','Light goes from air into glass (n = 1.5), angle of incidence 30°. The angle of refraction is about:','19.5°',['45°','48.6°','30°'],'sin θ₂ = sin 30°/1.5 = 0.333, so θ₂ ≈ 19.5° (smaller than 30°).'],
['f','Critical angle for total internal reflection (light goes from n₁ to n₂, n₁ > n₂):','sin θc = n₂/n₁',['sin θc = n₁/n₂','cos θc = n₂/n₁','tan θc = n₂/n₁'],'Put θ₂ = 90° in Snell’s law: n₁ sin θc = n₂.'],
['f','Critical angle for light going from glass (n = 1.5) into air:','about 42°',['about 48°','about 30°','90°'],'sin θc = 1/1.5 = 0.667, so θc ≈ 41.8°.'],
['f','Wavelength of light in a medium of index n (vacuum wavelength λ₀):','λ = λ₀/n',['λ = λ₀n','λ = λ₀/n²','λ = λ₀n/c'],'The frequency stays the same and the speed drops by n, so λ drops by n.'],
['f','Thin lens formula (object distance d, image distance d′):','1/f = 1/d + 1/d′',['f = d + d′','f = d·d′','1/f = d + d′'],'Distances are added as reciprocals, not directly.'],
['f','Linear magnification of a thin lens:','m = −d′/d',['m = d/d′','m = −d·d′','m = d′·d'],'The minus sign means that the image is inverted.'],
['f','A lens with f = 10 cm and an object at d = 30 cm. The image distance is:','15 cm',['7.5 cm','20 cm','40 cm'],'1/d′ = 1/10 − 1/30 = 2/30, so d′ = 15 cm.'],
['f','For the same lens (f = 10 cm, d = 30 cm), the magnification is:','−0.5',['+0.5','−2','+2'],'m = −d′/d = −15/30 = −0.5: the image is real, inverted and half-size.'],
['f','Optical power of a lens with focal length f (in metres):','D = 1/f',['D = f','D = 1/f²','D = f²'],'It is measured in dioptres (1 D = 1 m⁻¹).'],
['f','A lens has f = 25 cm. Its optical power is:','4 D',['0.04 D','25 D','0.25 D'],'D = 1/0.25 m = 4 D. Always convert centimetres to metres first.'],
['f','Focal length of a spherical mirror with radius of curvature R:','f = R/2',['f = 2R','f = R','f = R/4'],'The focus lies halfway between the mirror and its centre of curvature.'],
['f','A concave mirror has R = 40 cm. Its focal length is:','20 cm',['80 cm','40 cm','10 cm'],'f = R/2 = 20 cm.'],
['f','Lensmaker’s formula for a thin lens in air:','1/f = (n − 1)(1/R₁ − 1/R₂)',['1/f = (n + 1)(1/R₁ − 1/R₂)','1/f = n(1/R₁ + 1/R₂)','f = (n − 1)R₁R₂'],'A higher index n or stronger curvature gives a shorter focal length.'],
['f','A coin lies 2 m deep in water (n = 1.33). Looking from above, it seems to be at a depth of about:','1.5 m',['2.7 m','0.5 m','2 m'],'Apparent depth = real depth/n = 2/1.33 ≈ 1.5 m: the bottom looks shallower.'],
['f','Total optical power of two thin lenses placed in contact:','D = D₁ + D₂',['D = D₁D₂','1/D = D₁ + D₂','D = D₁ − D₂'],'Powers simply add. Example: 2 D and 3 D give 5 D.'],
['f','An object is 2 m from a plane mirror. The distance between the object and its image is:','4 m',['2 m','1 m','8 m'],'The image is 2 m behind the mirror, so the total distance is 2 + 2 = 4 m.'],
['t','A light ray hits a boundary along the normal. Its direction in the second medium:','does not change',['bends toward the normal','bends away from the normal','reverses'],'θ₁ = 0 gives sin θ₂ = 0, so θ₂ = 0.'],
['t','A ray goes from air into water. It bends:','toward the normal',['away from the normal','not at all','along the surface'],'Light slows down in the denser medium, and the ray moves closer to the normal.'],
['t','When does total internal reflection occur?','Light goes from a denser to a less dense medium at an angle above the critical angle',['Light goes from a less dense to a denser medium','Light hits the boundary along the normal','Light has a very long wavelength'],'Both conditions are needed: n₁ > n₂ and θ > θc.'],
['t','Which device is based on total internal reflection?','Optical fibre',['Plane mirror','Thin converging lens','Polarizer'],'Light stays inside the glass core because it always hits the wall above the critical angle.'],
['t','A converging lens forms a real image when the object is:','farther from the lens than the focal length',['closer than the focal length','exactly at the lens','at any distance'],'For d > f, the rays really meet behind the lens.'],
['t','An object is placed closer to a converging lens than its focus. The image is:','virtual, upright and magnified',['real and inverted','real and reduced','no image forms'],'This is how a magnifying glass works.'],
['t','A diverging lens always forms an image that is:','virtual, upright and reduced',['real and inverted','real and magnified','virtual and magnified'],'The lens spreads the rays, so they only seem to come from a point.'],
['t','What is a real image?','An image formed where the rays actually meet; it can be shown on a screen',['An image seen only in a mirror','An image that is always upright','An image formed by a plane mirror'],'Real images are made by actual crossing of rays.'],
['t','What is a virtual image?','An image from which the rays only seem to diverge; it cannot be shown on a screen',['An image formed by crossing rays','Always an inverted image','An image smaller than the object only'],'The rays do not really pass through the image point.'],
['t','The image in a plane mirror is:','virtual, upright and of the same size',['real and inverted','virtual and reduced','real and magnified'],'It appears behind the mirror at the same distance as the object.'],
['t','A concave mirror reflects a beam parallel to its axis:','through its focal point',['away from the axis','back along the same path','parallel to the axis'],'That is the definition of the focus of a concave mirror.'],
['t','A convex mirror always forms an image that is:','virtual, upright and reduced',['real and inverted','real and magnified','virtual and magnified'],'This is why it is used as a car side mirror: it gives a wide view.'],
['t','What is dispersion of light?','The dependence of the refractive index on wavelength',['The bending of light around obstacles','The reflection of light from a rough surface','The change of frequency in a medium'],'Because n depends on λ, colours refract differently, as in a prism.'],
['t','In glass, which colour is refracted the most?','violet',['red','green','all equally'],'The index n is larger for shorter wavelengths, so violet bends more than red.'],
['t','What causes chromatic aberration in a lens?','Dispersion: different colours have different focal lengths',['Reflection inside the lens','The shape of the lens only','Diffraction at the edges'],'Because n depends on colour, each colour focuses at a different distance.'],
['t','What is spherical aberration?','Rays far from the axis focus at a different point than rays near the axis',['Different colours focus at different points','The image is turned upside down','The image is always virtual'],'A spherical surface does not focus all rays perfectly into one point.'],
['t','A ray passing through the centre of a thin lens:','goes straight, without deviation',['goes through the focus','becomes parallel to the axis','reflects back'],'At the centre, the lens acts like a thin plane plate.'],
['t','A ray parallel to the axis of a thin converging lens:','passes through the focal point after the lens',['goes straight','goes away from the axis','is reflected'],'That is the definition of the focal point.'],
['t','A short-sighted (myopic) eye is corrected with a lens that is:','diverging (negative power)',['converging (positive power)','plane','a mirror'],'The eye focuses too early, so a diverging lens moves the image back onto the retina.'],
['t','Fermat’s principle says that light travels between two points along the path:','that takes the stationary (usually the shortest) time',['of the shortest length always','of the highest speed only','that is always a straight line'],'This explains reflection and refraction: in a medium with higher n, the light bends to save time.']
/*Q4_END*/]},
{id:5,t:"Interference. Diffraction",qs:[
['f','Young’s double slit, bright fringes:','d sin θ = mλ',['d sin θ = (m + ½)λ','d cos θ = mλ','d sin θ = mλ/2'],'Path difference between the slits must be a whole number of wavelengths.'],
['f','Fringe spacing on a screen at distance L (slit separation d):','Δy = λL/d',['Δy = λd/L','Δy = dL/λ','Δy = λ/(dL)'],'Larger λ or L spreads the fringes, larger d squeezes them.'],
['f','λ = 500 nm, L = 2 m, d = 0.5 mm. The fringe spacing is:','2 mm',['0.5 mm','20 mm','0.2 mm'],'Δy = 500·10⁻⁹ · 2 / 0.5·10⁻³ = 2·10⁻³ m.'],
['f','Optical path length in a medium of index n and geometric length l:','Δ = n·l',['Δ = l/n','Δ = n + l','Δ = n²l'],'Light in matter has λ/n, so n·l counts the wavelengths correctly.'],
['f','Condition of destructive interference (optical path difference Δ):','Δ = (m + ½)λ',['Δ = mλ','Δ = 2mλ','Δ = mλ/4'],'The waves meet in antiphase (half a wavelength off).'],
['f','Phase difference from an optical path difference Δ:','φ = 2πΔ/λ',['φ = λΔ/2π','φ = 2πλ/Δ','φ = Δ/(2πλ)'],'One wavelength of path equals 2π of phase.'],
['f','Thin film (n greater than air) at normal incidence, reflected light is bright when:','2nd = (m + ½)λ',['2nd = mλ','nd = λ','d = λ/2'],'One reflection has a π phase jump, which adds the extra ½λ.'],
['f','Minimum thickness of an antireflection coating (index n):','d = λ/(4n)',['d = λ/(2n)','d = λ/n','d = λn/4'],'Round trip is λ/2 in the film, so the two reflections cancel.'],
['f','λ = 550 nm and n = 1.38. The coating thickness d = λ/(4n) is about:','100 nm',['200 nm','400 nm','50 nm'],'550/(4·1.38) ≈ 99.6 nm.'],
['f','A grating has 500 lines per mm. Its period d is:','2 μm',['0.5 μm','5 μm','500 μm'],'d = 1 mm/500 = 0.002 mm = 2 μm.'],
['f','Grating d = 2 μm, λ = 500 nm. The first-order angle is about:','14.5°',['30°','45°','75.5°'],'sin θ = λ/d = 0.25, so θ ≈ 14.5°.'],
['f','For d = 2 μm and λ = 500 nm, the highest visible order is:','3',['4','5','2'],'m < d/λ = 4. Order 4 would need sin θ = 1, which is the edge.'],
['f','Minima of single-slit diffraction (slit width a):','a sin θ = mλ, m = ±1, ±2…',['a sin θ = (m + ½)λ','a cos θ = mλ','a sin θ = mλ/2'],'The slit splits into halves whose waves cancel in pairs.'],
['f','Slit a = 0.1 mm, λ = 600 nm, L = 1 m. Width of the central maximum:','12 mm',['6 mm','1.2 mm','24 mm'],'Width = 2λL/a = 2·600·10⁻⁹/10⁻⁴ = 12 mm.'],
['f','First minimum for a circular aperture of diameter D:','sin θ = 1.22 λ/D',['sin θ = 1.22 D/λ','sin θ = λ/(1.22D)','sin θ = 2λ/D'],'A smaller aperture or longer λ gives a bigger spot.'],
['f','Resolving power of a grating (order m, N lines):','R = mN',['R = m/N','R = N/m','R = m + N'],'More lines and higher order separate close wavelengths better.'],
['f','The wavelength in a double-slit experiment is doubled. The fringe spacing:','doubles',['halves','quadruples','does not change'],'Δy is proportional to λ.'],
['f','The slit separation d is doubled. The fringe spacing:','halves',['doubles','does not change','quadruples'],'Δy is inversely proportional to d.'],
['f','Two coherent waves of equal intensity I₀ meet in phase. The resulting intensity is:','4I₀',['2I₀','I₀','8I₀'],'Amplitudes add (2A), and intensity goes as the square, so 4I₀.'],
['f','Bragg’s law for X-ray diffraction on crystal planes (spacing d):','2d sin θ = mλ',['d sin θ = mλ','2d cos θ = mλ','d sin θ = 2mλ'],'The path difference between neighbouring planes is 2d sin θ.'],
['t','What is interference?','Superposition of coherent waves that redistributes energy into maxima and minima',['Bending of light around edges','Change of speed in a medium','Splitting of white light'],'Total energy is conserved; it only moves between bright and dark places.'],
['t','What are coherent waves?','Waves with a constant phase difference',['Waves of different speed','Waves of the same amplitude only','Waves of any frequency'],'Only coherent waves give a stable pattern.'],
['t','Why do two ordinary bulbs not give interference fringes?','Their light is incoherent: the phases change randomly',['Light does not interfere','The bulbs are too bright','Their light has no wavelength'],'Atoms emit independent bursts, so the pattern averages out.'],
['t','How does Young’s experiment get coherent sources?','One wavefront is divided by two slits',['Two lasers are used','Two bulbs are used','Light is reflected twice'],'Both slits get light from the same wave, so their phases are linked.'],
['t','White light in Young’s experiment: the central fringe is:','white, and the others are coloured',['black','red','violet'],'At the centre, all colours have zero path difference.'],
['t','Reflection from a denser medium (larger n) gives a phase change of:','π',['0','π/2','2π'],'The wave is inverted, like a pulse at a fixed end.'],
['t','Reflection from a less dense medium (smaller n) gives a phase change of:','0',['π','π/2','2π'],'There is no inversion, like a pulse at a free end.'],
['t','The colours of a soap bubble are caused by:','interference in a thin film',['dispersion in water only','polarization','absorption'],'Light reflected from the two surfaces interferes, and the result depends on λ.'],
['t','An antireflection coating works because:','the reflected waves cancel by destructive interference',['it absorbs all light','it polarizes the light','it increases the refractive index of glass'],'More light is then transmitted.'],
['t','Newton’s rings are formed by interference in:','the air gap between a lens and a flat plate',['a diffraction grating','a double slit','a polarizer'],'The gap thickness grows with the radius, giving rings.'],
['t','Huygens’ principle says:','each point of a wavefront is a source of secondary spherical wavelets',['light travels only straight','waves cannot overlap','waves always have the same phase'],'The new wavefront is the envelope of the wavelets.'],
['t','Diffraction is most noticeable when the obstacle size is:','comparable to the wavelength',['much larger than λ','much smaller than λ only','infinite'],'For big obstacles, shadows are sharp.'],
['t','A single slit is made narrower. The central maximum becomes:','wider',['narrower','brighter and narrower','unchanged'],'a sin θ = λ: smaller a gives a larger angle.'],
