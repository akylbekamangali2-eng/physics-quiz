['t','Why can a chain reaction of fission sustain itself?','Each fission emits 2–3 neutrons that can cause further fissions',['Fragments are always stable','The reaction produces protons','Energy is supplied from outside'],'Each fission produces several free neutrons. If on average at least one of them causes another fission, the process continues by itself. With one on average (multiplication factor k = 1) the power is steady, as in a reactor, and with k > 1 it grows rapidly, as in a bomb.'],
['t','Why are ¹³⁷Cs and ⁹⁰Sr among the most dangerous fission products?','Their half-lives are about 30 years: strongly active and long-lasting',['They emit only visible light','Their half-lives are a few seconds','They are stable and non-toxic'],'A half-life of about 30 years is the “worst” range. It is short enough that the nuclides are strongly radioactive, and long enough that they persist for centuries. Short-lived isotopes decay quickly, and very long-lived ones are only weakly active.'],
['t','Why does ¹³⁷Cs spread through the food chain?','It chemically resembles potassium and is taken up as part of body fluids',['It dissolves in oil only','It is attracted to bone','It is a noble gas'],'Caesium is an alkali metal like potassium, so organisms mistake it for potassium and include it in the electrolytes. It is passed up the food chain and reconcentrated from the environment. Because it is a soluble electrolyte, it is also excreted again, unlike strontium in bones.'],
['t','Why is ⁹⁰Sr especially dangerous for the body?','It mimics calcium and is deposited in bones, where it stays',['It mimics iron and stays in blood','It is a gas that leaves the lungs','It is absorbed only by hair'],'Strontium is chemically similar to calcium, so the body builds it into bone. There it is not excreted, and its radiation can cause cancer and damage the rapidly dividing cells of the bone marrow. ⁹⁰Sr is less volatile than ¹³⁷Cs, so it is less likely to leave a reactor in an accident.'],
['t','How can potassium iodide tablets protect against ¹³¹I after an accident?','They fill the thyroid with stable iodine, so radioactive iodine is excreted',['They neutralize the radiation in the air','They turn ¹³¹I into stable iodine','They block gamma rays in the skin'],'The thyroid takes up iodine from the blood, up to a maximum. If it is loaded with stable iodine beforehand, there is little room left for ¹³¹I, which is then more likely to leave the body. The tablets do not change the radioactivity itself and do not protect against other nuclides.'],
['t','Why does fusion need a very high temperature?','Nuclei need enough kinetic energy to overcome their Coulomb repulsion',['Nuclei must be melted first','The nuclear force acts only at high T','Neutrons must be created thermally'],'Nuclei have positive charges and repel each other with a long-range Coulomb force, while the attractive nuclear force acts only at distances of a few fm. The nuclei must therefore approach very fast. Once they get close enough, the energy released is much larger than the kinetic energy that was needed.'],
['t','Why can fusion occur in the Sun even though kT ≈ 1 keV is far below the Coulomb barrier of about 1 MeV?','Quantum tunnelling and the fast tail of the Maxwell distribution make it possible',['The barrier does not exist inside the Sun','Gravity removes the Coulomb force','Neutrinos push the nuclei together'],'Most particles are slower than needed, but a few in the fast tail of the distribution get closer, and for those the nuclei can also tunnel through the barrier. Because of the huge number of particles and the long time, this is enough. This is the same effect that allows α decay.'],
['t','Which stars burn mainly through the proton–proton cycle?','Stars with core temperature below about 15 million K, such as the Sun',['Only neutron stars','Stars hotter than 10⁹ K','Planets such as Jupiter'],'The proton–proton cycle works at relatively low temperatures and powers the Sun and smaller stars. Hotter and heavier stars use other cycles in which heavier nuclei act as catalysts. Planets like Jupiter are far too cold for fusion.'],
['t','Why is the D–T reaction the most promising for fusion power?','It releases 17.6 MeV and ignites at a lower temperature than other fusion fuels',['It produces no neutrons','It uses only common hydrogen','It works at room temperature'],'Deuterium and tritium have a high reaction rate at the lowest temperatures among the fusion fuels, while the energy yield is large, 17.6 MeV per reaction. It still needs temperatures of the order of 10⁷–10⁸ K, and it does produce a fast neutron, which carries most of the energy.'],
['t','Which material limits the supply of fuel for the D–T process?','Lithium-6, needed to breed tritium',['Deuterium from seawater','Hydrogen in the air','Neutrons from the Sun'],'Deuterium is practically unlimited (the oceans contain over 10¹⁵ tons). Tritium must be bred from ⁶Li, which makes up only 7.4% of natural lithium, so it sets the limit. Fast neutrons can also breed tritium from the more abundant ⁷Li, which widens the supply.'],
['t','Which quantities must be balanced in any nuclear reaction?','Charge, mass number (baryon number), energy and momentum',['Only the number of protons','Only the total mass','Only the number of neutrons'],'In a nuclear reaction the electric charge Z and the number of nucleons A are the same before and after. Total energy (including rest energy) and momentum are also conserved. The mass is not conserved separately: the mass difference is exactly what turns into the energy Q.'],
['t','In the fission of ²³⁵U most of the 200 MeV appears as:','kinetic energy of the fission fragments, which becomes heat',['light from the fragments','kinetic energy of the neutrons','binding energy of new nuclei'],'About 170 MeV is the kinetic energy of the two fragments, which are strongly repelled by Coulomb forces. They are stopped within the fuel and heat it. The remaining energy goes to the fission neutrons, the prompt gamma rays and the later decays of the fragments. This heat is what a nuclear power plant uses.']
/*Q15_END*/]}
];

const FAKE='@physicsquiz.app';
const uname=u=>u&&u.endsWith(FAKE)?u.slice(0,-FAKE.length):u;
async function auth(){
  const up=mode==='up';
  FU=document.getElementById('em').value.trim().toLowerCase();const u=FU,p=document.getElementById('pw').value;
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){msg='Username: 3-20 characters, only a-z, 0-9, _ and .';return render()}
  if(p.length<6){msg='Password must be at least 6 characters';return render()}
  msg='Please wait...';render();
  const e=u+FAKE;
  const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){
    const m=r.error.message;
    msg=/invalid login/i.test(m)?'Wrong username or password':/already/i.test(m)?'This username is taken':m;
  }
  else if(up&&!r.data.session)msg='Account created, but email confirmation is still ON in Supabase. Turn it off (Authentication → Sign In / Providers → Email → Confirm email).';
  else{msg='';FU=''}
  render();
}

function acct(){
  if(!sb)return '<span class="mu">Offline mode: progress is saved in this browser only.</span>';
  if(user)return `<div class="chip"><span><b>${esc(uname(user.email))}</b> <span class="mu">· ${esc(msg||'Synced')}</span></span><button class="btn g" data-a="out">Sign out</button></div>`;
  return '';
}
function authPanel(){
  if(!sb||user)return '';
  const up=mode==='up';
  return `<section class="sync"><div><b>Save your progress online</b><div class="mu">Sign in to keep results on every device and join the leaderboard.</div></div>
  <div class="tabs"><button class="${up?'':'on'}" data-a="mode" data-m="in">Sign in</button><button class="${up?'on':''}" data-a="mode" data-m="up">Create account</button></div>
  <div class="row"><input id="em" type="text" placeholder="Username" value="${esc(FU)}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${up?'new-password':'current-password'}">
  <button class="btn" data-a="go">${up?'Create account':'Sign in'}</button></div>${msg?`<div class="msg">${esc(msg)}</div>`:''}</section>`;
}

// ---- Leaderboard (top 10 by mastered questions) ----
let LB=null;
async function loadLB(){
  if(!sb)return;
  try{const r=await sb.rpc('get_leaderboard');LB=r.error?null:r.data;}catch(e){LB=null}
  const el=document.getElementById('lb');
  if(el)el.innerHTML=lbInner();
}
function lbInner(){
  if(!sb||!LB)return '';
  const me=user?uname(user.email):'';
  const rows=LB.length?LB.map((r,i)=>`<div class="lbr${r.username===me?' me':''}"><span class="lbn">${i+1}</span><span class="lbu">${esc(r.username)}</span><span class="lbs">${r.score}</span></div>`).join(''):'<div class="mu">No results yet. Be the first!</div>';
  return `<div class="box"><b>Leaderboard · Top 10</b><div class="mu">Score = questions mastered</div><div style="margin-top:10px">${rows}</div></div>`;
}
const lbBox=()=>`<div id="lb">${lbInner()}</div>`;

function start(mode){
  const m=MODS[V.id-1],p=P(m.id);
  let list=m.qs.map((q,i)=>({i,q}));
  if(mode==='wrong')list=list.filter(x=>!p.c[x.i]);
  if(mode==='f'||mode==='t')list=list.filter(x=>x.q[0]===mode);
  V={v:'quiz',id:m.id,list:shuffle(list),k:0,ok:0,sel:null,opts:null};
  prep();quiz();
}
function prep(){V.opts=shuffle([V.list[V.k].q[2],...V.list[V.k].q[3]]);V.sel=null}

function quiz(){
  $.style.cssText=acc(V.id);
  const x=V.list[V.k],q=x.q,n=V.list.length,done=V.sel!==null;
  $.innerHTML=`<div class="hd" style="align-items:center"><button class="back" data-a="open" data-id="${V.id}">← Exit</button><span class="mu">${V.k+1} / ${n} · correct ${V.ok}</span></div>
  <div class="bar" style="margin-top:12px"><i style="width:${V.k/n*100}%"></i></div>
  <div class="box" style="margin-top:14px"><span class="tag">${q[0]==='f'?'Formula':'Theory'}</span><div class="q">${esc(q[1])}</div>`+
  V.opts.map((o,i)=>{let cl='';if(done){if(o===q[2])cl='ok';else if(i===V.sel)cl='no'}
  return `<button class="opt ${cl}" data-a="pick" data-i="${i}" ${done?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`}).join('')+
  (done?`${fb(q)}
  <div class="row"><button class="btn" data-a="next">${V.k+1<n?'Next':'Results'}</button></div>`:'<div class="mu" style="margin-top:6px">Keys 1–4 to answer</div>')+'</div>';
}

function fb(q){const ok=V.opts[V.sel]===q[2],L=i=>'ABCD'[i],ci=V.opts.indexOf(q[2]);
 const others=V.opts.map((o,i)=>i!==ci?`<li><b>${L(i)}</b> ${esc(o)} — ${i===V.sel?'your answer, wrong':'wrong'}</li>`:'').join('');
 const tip=q[0]==='f'?'How to check a formula yourself: 1) compare the units on the left and right; 2) try limiting cases (for example x = 0 or t = 0); 3) plug in simple numbers and see whether the result is reasonable.':'How to remember it: state the rule in your own words and find the word that makes the wrong options false (often “always”, “does not depend”, “proportional to the square”).';
 return `<div class="ex"><b>${ok?'Correct.':'Wrong.'}</b> Correct answer: <b>${L(ci)}</b> — ${esc(q[2])}${ok?'':`<br>You chose: <b>${L(V.sel)}</b> — ${esc(V.opts[V.sel])}`}<p style="margin:10px 0 0"><b>Explanation.</b> ${esc(q[4])}</p></div>
 <details class="why"><summary>Other options</summary><ul class="fl">${others}</ul></details>
 <details class="why"><summary>How to check and remember</summary><div class="ex">${tip}</div></details>
 <details class="why"><summary>Theory for module ${V.id}: formulas and derivation</summary>${secs(V.id)}</details>
 <details class="why"><summary>Key ideas and common mistakes</summary>${xsec(V.id,0)}</details>`}
function pick(i){
  if(V.sel!==null)return;
  const x=V.list[V.k],p=P(V.id),r=V.opts[i]===x.q[2];
  V.sel=i;
  if(r){V.ok++;p.c[x.i]=1;cloud(()=>sb.from('progress').upsert({module_id:V.id,question_idx:x.i},{onConflict:PK}))}
  else{delete p.c[x.i];cloud(()=>sb.from('progress').delete().eq('module_id',V.id).eq('question_idx',x.i))}
  save();quiz();
}
function next(){
  if(V.k+1<V.list.length){V.k++;prep();quiz();return}
  const p=P(V.id),n=V.list.length,pc=Math.round(V.ok/n*100);
  p.att++;p.best=Math.max(p.best,pc);save();
  cloud(()=>sb.from('module_stats').upsert({module_id:V.id,best:p.best,attempts:p.att},{onConflict:SK}));
  $.innerHTML=`<div class="box" style="text-align:center"><div class="mu">Module ${V.id}</div><div class="big">${V.ok} / ${n}</div><div class="mu">${pc}%</div>
  <div class="hero" style="margin:12px 0">${wave(pc/100,3,600,70,.9)}</div>
  <div class="row" style="justify-content:center"><button class="btn" data-a="open" data-id="${V.id}">Back to module</button>
  <button class="btn g" data-a="start" data-mode="wrong" ${Object.keys(p.c).length<MODS[V.id-1].qs.length?'':'disabled'}>Retry not mastered</button></div></div>`;
}
